  let ms=[...data.matches].reverse();
  if(fPlayer)ms=ms.filter(m=>inMatch(m,fPlayer));
  if(fMode)ms=ms.filter(m=>m.mode===fMode);
  if(fNight)ms=ms.filter(m=>m.matchNightId===fNight);
  if(q)ms=ms.filter(m=>[...m.teamAPlayerIds,...m.teamBPlayerIds].some(id=>byId(data.players,id).name.includes(q)));
  const groups={};
  ms.forEach(m=>{ const k=monthKey(m.matchDate); (groups[k]=groups[k]||[]).push(m); });
  const keys=Object.keys(groups).sort().reverse();
  const filtered=fPlayer||fMode||fNight||q;
  return <div className="screen">
    <div className="headerBar"><div className="screenTitle">היסטוריה</div>
      <button className="btn ghost small" onClick={()=>go({s:'past'})}>+ משחק עבר</button></div>
    {data.matches.length===0
      ? <EmptyState icon="📖" title="ההיסטוריה עוד ריקה" sub="כל משחק שתזינו יהפוך כאן לעוד פרק" action="משחק ראשון" onAction={()=>go({s:'new'})}/>
      : <>
      <div className="searchBox"><input placeholder="חיפוש לפי שם שחקן…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="chipRow" style={{marginBottom:6}}>
        <button className={'chip'+(showF?' on':'')} onClick={()=>setShowF(v=>!v)}>סינון {filtered?'●':''}</button>
        {fPlayer&&<button className="chip on" onClick={()=>setFPlayer('')}>{byId(data.players,fPlayer).name} ✕</button>}
        {fMode&&<button className="chip on" onClick={()=>setFMode('')}>{fMode==='singles'?'1 על 1':'2 על 2'} ✕</button>}
        {fNight&&<button className="chip on" onClick={()=>setFNight('')}>ערב ✕</button>}
      </div>
      {showF&&<div className="card" style={{marginBottom:8}}>
        <div className="eyebrow" style={{marginBottom:6}}>שחקן</div>
        <select value={fPlayer} onChange={e=>setFPlayer(e.target.value)}><option value="">הכל</option>
          {data.players.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
        <div className="eyebrow" style={{margin:'10px 0 6px'}}>סוג</div>
        <div className="chipRow">
          <button className={'chip'+(fMode===''?' on':'')} onClick={()=>setFMode('')}>הכל</button>
          <button className={'chip'+(fMode==='singles'?' on':'')} onClick={()=>setFMode('singles')}>1 על 1</button>
          <button className={'chip'+(fMode==='doubles'?' on':'')} onClick={()=>setFMode('doubles')}>2 על 2</button>
        </div>
        {data.nights.length>0&&<><div className="eyebrow" style={{margin:'10px 0 6px'}}>ערב</div>
          <select value={fNight} onChange={e=>setFNight(e.target.value)}><option value="">הכל</option>
            {data.nights.map(n=><option key={n.id} value={n.id}>{(n.title||'ערב')+' · '+fmtDateShort(n.date)}</option>)}</select></>}
      </div>}
      <div className="tiny muted" style={{margin:'4px 2px'}}>{ms.length} משחקים</div>
      {keys.map(k=><div key={k}>
        <div className="monthHead">{monthLabel(k).toUpperCase()}</div>
        <div className="stack">{groups[k].map(m=><HistRow key={m.id} m={m} players={data.players} onClick={()=>go({s:'match',id:m.id})}/>)}</div>
      </div>)}
    </>}
  </div>;
}

/* ================= MATCH DETAIL ================= */
function MatchDetail({data,go,id}){
  const m=data.matches.find(x=>x.id===id);
  const [del,setDel]=useState(false);
  if(!m)return <div className="screen"><EmptyState icon="❔" title="המשחק לא נמצא"/></div>;
  const night=m.matchNightId? data.nights.find(n=>n.id===m.matchNightId):null;
  let ctx=null;
  if(m.mode==='singles'){
    const [pa]=m.teamAPlayerIds,[pb]=m.teamBPlayerIds;
    // "המפגש ה-N": לפי הסדר הכרונולוגי המלא (תאריך -> שעה -> סדר), לא לפי createdAt
    const allH=headToHead(pa,pb,data.matches).matches; const idx=allH.findIndex(x=>x.id===m.id);
    const h=headToHead(pa,pb,allH.slice(0,idx+1));
    ctx={n:h.total,a:byId(data.players,pa),b:byId(data.players,pb),aW:h.aWins,bW:h.bWins};
  }
  const doDelete=async()=>{ await db.matches.delete(id); await data.reload(); go({s:'history'}); };
  return <div className="screen">
    <div className="headerBar"><button className="backBtn" onClick={()=>go({s:'history'})}>→</button>
      <div className="screenTitle">כרטיס משחק</div></div>
    <MatchCard m={m} players={data.players}/>
    <div className="card" style={{marginTop:12}}>
      <div className="tiny muted stack" style={{lineHeight:1.7}}>
        <div>📅 {fmtDate(m.matchDate)}{m.matchTime&&<span> · 🕐 {m.matchTime}</span>}</div>
        <div>🎯 עד {m.targetScore} · ניצחון בפער {m.winBy}{m.maxScore?' · תקרה '+m.maxScore:''}</div>
        {night&&<button className="linkAll" style={{textAlign:'start',padding:0}} onClick={()=>go({s:'night',id:night.id})}>🌙 {night.title||'ערב בדמינטון'} · {fmtDateShort(night.date)}</button>}
        {ctx&&ctx.n>1&&<div>⚔️ המפגש ה־{ctx.n} של {ctx.a.name} ו{ctx.b.name} ביחידות · מאזן אחרי המשחק: {ctx.aW}–{ctx.bW}</div>}
      </div>
    </div>
    {m.mode==='singles'&&<button className="btn ghost" style={{marginTop:12,width:'100%'}}
      onClick={()=>go({s:'h2h',a:m.teamAPlayerIds[0],b:m.teamBPlayerIds[0]})}>לעמוד היריבות המלא ⚔️</button>}
    <div className="grid2" style={{marginTop:12}}>
      <button className="btn ghost" onClick={()=>go({s:'edit',id})}>עריכת משחק</button>
      <button className="btn danger" onClick={()=>setDel(true)}>מחיקה</button>
    </div>
    {del&&<ConfirmDialog danger title="למחוק את המשחק?" confirmLabel="מחיקה"
      body={byId(data.players,m.teamAPlayerIds[0]).name+' '+m.teamAScore+'–'+m.teamBScore+' '+byId(data.players,m.teamBPlayerIds[0]).name+'\n'+fmtDate(m.matchDate)+'\n\nכל הסטטיסטיקות הקשורות יתעדכנו אוטומטית.'}
      onConfirm={doDelete} onCancel={()=>setDel(false)}/>}
  </div>;
}

/* ================= STATS & HALL OF FAME ================= */
function LeaderList({rows,fmt}){
  return <div className="stack">{rows.map((r,i)=>
    <div key={r.p.id} className="histRow" style={{padding:'10px 12px'}}>
      <div style={{fontWeight:900,color:i===0?'var(--gold)':'var(--text3)',width:22,textAlign:'center'}}>{i+1}</div>
      <Avatar p={r.p} size={38}/>
      <div className="histNames">{r.p.name}</div>
      <div className="histScore" style={{color:'var(--court)'}}>{fmt(r)}</div>
    </div>)}</div>;
}
function Stats({data,go}){
  const {players,matches}=data;
  const [scope,setScope]=useState('overall');
  const sm=filterMatchesByMode(matches,scope);
  const stats=players.map(p=>({p,st:playerStats(p.id,sm)})).filter(x=>x.st.played>0);
  const duos=scope==='singles'?[]:allDuos(matches).filter(d=>d.played>=CFG.MIN_DUO_MATCHES).sort((a,b)=>b.winRate-a.winRate||b.wins-a.wins);
  const mostRiv=scope==='doubles'?null:mostPlayedRivalry(players,matches);
  const closeRiv=scope==='doubles'?null:closestRivalry(players,matches);
  const totalPts=matches.reduce((s,m)=>s+m.teamAScore+m.teamBScore,0);
  if(matches.length===0)return <div className="screen">
    <div className="screenTitle" style={{marginBottom:16}}>סטטיסטיקות</div>
    <EmptyState icon="📊" title="עוד אין נתונים" sub="שחקו כמה משחקים והמספרים יתחילו לספר סיפור" action="משחק ראשון" onAction={()=>go({s:'new'})}/></div>;
  return <div className="screen">
    <div className="screenTitle" style={{marginBottom:16}}>סטטיסטיקות</div>
    <div className="grid3">
      <StatBox v={matches.length} l="משחקים"/>
      <StatBox v={matches.filter(m=>m.mode==='singles').length+' / '+matches.filter(m=>m.mode==='doubles').length} l="יחידות / זוגות"/>
      <StatBox v={totalPts} l="נקודות שוחקו"/>
    </div>
    <button className="btn ghost" style={{width:'100%',marginTop:12}} onClick={()=>go({s:'hof',scope})}>🏆 היכל התהילה</button>

    <div style={{marginTop:16}}><ScopeTabs scope={scope} onChange={setScope}/></div>
    {stats.length===0&&<div style={{marginTop:12}}><EmptyState icon={scope==='singles'?'🤺':'🤝'} title={scope==='singles'?'עוד אין משחקי יחידות':'עוד אין משחקי זוגות'}/></div>}
    {stats.length>0&&<>
    <div className="sectionTitle">הכי הרבה ניצחונות</div>
    <LeaderList rows={[...stats].sort((a,b)=>b.st.wins-a.st.wins).slice(0,5)} fmt={r=>r.st.wins}/>
    <div className="sectionTitle">אחוז ניצחון <span className="tiny muted" style={{fontWeight:600}}>(מינ׳ {CFG.MIN_MATCHES_WINRATE} משחקים)</span></div>
    {stats.filter(x=>x.st.played>=CFG.MIN_MATCHES_WINRATE).length===0
      ? <div className="tiny muted">צריך לפחות {CFG.MIN_MATCHES_WINRATE} משחקים לשחקן כדי להופיע כאן</div>
      : <LeaderList rows={stats.filter(x=>x.st.played>=CFG.MIN_MATCHES_WINRATE).sort((a,b)=>b.st.winRate-a.st.winRate).slice(0,5)} fmt={r=>r.st.winRate+'%'}/>}
    <div className="sectionTitle">הכי פעילים</div>
    <LeaderList rows={[...stats].sort((a,b)=>b.st.played-a.st.played).slice(0,5)} fmt={r=>r.st.played}/>
    <div className="sectionTitle">רצף הניצחונות הארוך</div>
    <LeaderList rows={[...stats].sort((a,b)=>b.st.bestStreak-a.st.bestStreak).slice(0,5)} fmt={r=>r.st.bestStreak}/>
    <div className="sectionTitle">הכי הרבה נקודות</div>
    <LeaderList rows={[...stats].sort((a,b)=>b.st.pf-a.st.pf).slice(0,5)} fmt={r=>r.st.pf}/>
    </>}

    {duos.length>0&&<><div className="sectionTitle">הצמדים הטובים <span className="tiny muted" style={{fontWeight:600}}>(מינ׳ {CFG.MIN_DUO_MATCHES} משחקים)</span></div>
      <div className="stack">{duos.slice(0,5).map((d,i)=>{ const [x,y]=d.ids.map(id=>byId(players,id));
        return <div key={d.ids.join()} className="histRow">
          <div style={{fontWeight:900,color:i===0?'var(--gold)':'var(--text3)',width:22,textAlign:'center'}}>{i+1}</div>
          <div style={{display:'flex'}}><Avatar p={x} size={36}/><Avatar p={y} size={36} style={{marginInlineStart:-10}}/></div>
          <div className="histNames">{x.name} + {y.name}
            {i===0&&<div className="tiny" style={{color:'var(--court)'}}>הכימיה הכי טובה 🤝</div>}</div>
          <div className="histScore">{d.wins}–{d.losses} · {Math.round(d.winRate)}%</div>
        </div>; })}</div></>}

    {(mostRiv||closeRiv)&&<><div className="sectionTitle">יריבויות</div><div className="stack">
      {mostRiv&&<button className="card rowBetween" style={{width:'100%'}} onClick={()=>go({s:'h2h',a:mostRiv.a.id,b:mostRiv.b.id})}>
        <div><div className="eyebrow">היריבות הכי משוחקת</div>
          <div style={{fontWeight:800,marginTop:6}}>{mostRiv.a.name} נגד {mostRiv.b.name}</div></div>
        <div className="hofVal">{mostRiv.h.total} מפגשים</div></button>}
      {closeRiv&&<button className="card rowBetween" style={{width:'100%'}} onClick={()=>go({s:'h2h',a:closeRiv.a.id,b:closeRiv.b.id})}>
        <div><div className="eyebrow">היריבות הכי צמודה</div>
          <div style={{fontWeight:800,marginTop:6}}>{closeRiv.a.name} נגד {closeRiv.b.name}</div></div>
        <div className="hofVal">{closeRiv.h.aWins}–{closeRiv.h.bWins}</div></button>}
    </div></>}
  </div>;
}

function HallOfFame({data,go,initialScope}){
  const {players}=data;
  const [scope,setScope]=useState(initialScope||'overall');
  const matches=filterMatchesByMode(data.matches,scope);
  const stats=players.map(p=>({p,st:playerStats(p.id,matches)})).filter(x=>x.st.played>0);
  const top=(sorter)=> [...stats].sort(sorter)[0];
  const wins=top((a,b)=>b.st.wins-a.st.wins);
  const wr=[...stats].filter(x=>x.st.played>=CFG.MIN_MATCHES_WINRATE).sort((a,b)=>b.st.winRate-a.st.winRate)[0];
  const played=top((a,b)=>b.st.played-a.st.played);
  const pts=top((a,b)=>b.st.pf-a.st.pf);
  const streak=top((a,b)=>b.st.bestStreak-a.st.bestStreak);
  const losses=top((a,b)=>b.st.losses-a.st.losses);
  const duo=scope==='singles'?null:allDuos(matches).filter(d=>d.played>=CFG.MIN_DUO_MATCHES).sort((a,b)=>b.winRate-a.winRate)[0];
  const big=biggestVictory(matches);
  const close=scope==='doubles'?null:closestRivalry(players,matches);
  const longRiv=scope==='doubles'?null:mostPlayedRivalry(players,matches);
  const Row=({icon,label,children,onClick})=>(
    <button className="recordRow" style={{width:'100%',textAlign:'start'}} onClick={onClick}>
      <div className="recordIcon">{icon}</div>
      <div style={{flex:1}}><div className="eyebrow">{label}</div><div style={{marginTop:4}}>{children}</div></div>
    </button>);
  return <div className="screen">
    <div className="headerBar"><button className="backBtn" onClick={()=>go({s:'stats'})}>→</button>
      <div className="screenTitle">🏆 היכל התהילה</div></div>
    <div style={{marginBottom:12}}><ScopeTabs scope={scope} onChange={setScope}/></div>
    {stats.length===0? <EmptyState icon="🏆" title="ההיכל עוד ריק" sub={scope==='overall'?'שיאים נולדים מתוך משחקים':'עוד אין משחקים בקטגוריה הזו'}/> :
    <div className="card">
      {wins&&<Row icon="🏆" label="הכי הרבה ניצחונות בקריירה" onClick={()=>go({s:'player',id:wins.p.id})}>
        <b>{wins.p.name}</b> · <span className="hofVal">{wins.st.wins}</span></Row>}
      {wr&&<Row icon="👑" label={'אחוז הניצחון הגבוה (מינ׳ '+CFG.MIN_MATCHES_WINRATE+')'} onClick={()=>go({s:'player',id:wr.p.id})}>
        <b>{wr.p.name}</b> · <span className="hofVal">{wr.st.winRate}%</span></Row>}
      {played&&<Row icon="⚔️" label="הכי הרבה משחקים" onClick={()=>go({s:'player',id:played.p.id})}>
        <b>{played.p.name}</b> · <span className="hofVal">{played.st.played}</span></Row>}
      {pts&&<Row icon="🎯" label="הכי הרבה נקודות" onClick={()=>go({s:'player',id:pts.p.id})}>
        <b>{pts.p.name}</b> · <span className="hofVal">{pts.st.pf}</span></Row>}
      {streak&&streak.st.bestStreak>1&&<Row icon="🔥" label="רצף הניצחונות הארוך" onClick={()=>go({s:'player',id:streak.p.id})}>
        <b>{streak.p.name}</b> · <span className="hofVal">{streak.st.bestStreak} ברצף</span></Row>}
      {losses&&losses.st.losses>0&&<Row icon="🪦" label="הכי הרבה הפסדים" onClick={()=>go({s:'player',id:losses.p.id})}>
        <b>{losses.p.name}</b> · <span className="hofVal" style={{color:'var(--loss)'}}>{losses.st.losses}</span></Row>}
      {duo&&(()=>{const [x,y]=duo.ids.map(id=>byId(players,id));
        return <Row icon="🤝" label="צמד הזוגות הטוב">
          <b>{x.name} + {y.name}</b> · <span className="hofVal">{duo.wins}–{duo.losses}</span></Row>;})()}
      {big&&<Row icon="💀" label="הניצחון הגדול" onClick={()=>go({s:'match',id:big.m.id})}>
        <b><TeamNames ids={winnersOf(big.m)} players={players}/></b> {Math.max(big.m.teamAScore,big.m.teamBScore)}–{Math.min(big.m.teamAScore,big.m.teamBScore)}
        <span className="hofVal"> · פער +{big.margin}</span>
        <div className="tiny muted">{fmtDateTimeShort(big.m)}</div></Row>}
      {close&&<Row icon="❤️" label="היריבות הכי צמודה" onClick={()=>go({s:'h2h',a:close.a.id,b:close.b.id})}>
        <b>{close.a.name} נגד {close.b.name}</b> · <span className="hofVal">{close.h.aWins}–{close.h.bWins}</span></Row>}
      {longRiv&&<Row icon="🕰️" label="היריבות הכי ותיקה" onClick={()=>go({s:'h2h',a:longRiv.a.id,b:longRiv.b.id})}>
        <b>{longRiv.a.name} נגד {longRiv.b.name}</b> · <span className="hofVal">{longRiv.h.total} מפגשים</span></Row>}
    </div>}
  </div>;
}

/* ================= NIGHTS ================= */
function Nights({data,go}){
  const [starting,setStarting]=useState(false);
  const [title,setTitle]=useState('');
  const active=data.settings.activeNightId? data.nights.find(n=>n.id===data.settings.activeNightId&&!n.endedAt):null;
  const start=async()=>{
    const n={id:uid(),date:nowISO(),title:title.trim()||null,createdAt:nowISO(),updatedAt:nowISO(),endedAt:null};
    await db.nights.add(n); await data.reload(); await data.setSetting('activeNightId',n.id); setStarting(false); setTitle('');
  };
  const groups={};
  data.nights.forEach(n=>{ const k=monthKey(n.date); (groups[k]=groups[k]||[]).push(n); });
  const keys=Object.keys(groups).sort().reverse();
  return <div className="screen">
    <div className="headerBar"><div className="screenTitle">ערבי בדמינטון</div></div>
    {active
      ? <div className="courtHero"><CourtLines/><div className="inner">
          <div className="eyebrow green">🟢 ערב פעיל</div>
          <div style={{fontWeight:900,fontSize:20,marginTop:6}}>{active.title||'ערב בדמינטון'}</div>
          <div className="tiny muted">{fmtDate(active.date)} · {data.matches.filter(m=>m.matchNightId===active.id).length} משחקים עד עכשיו</div>
          <div className="grid2" style={{marginTop:14}}>
            <button className="btn primary" onClick={()=>go({s:'new'})}>+ משחק לערב</button>
            <button className="btn ghost" onClick={async()=>{ await db.nights.update(active.id,{endedAt:nowISO(),updatedAt:nowISO()});
              await data.setSetting('activeNightId',null); await data.reload(); go({s:'night',id:active.id}); }}>סיום הערב 🌙</button>
          </div>
        </div></div>
      : <button className="btn primary" style={{width:'100%'}} onClick={()=>setStarting(true)}>🏸 פתיחת ערב בדמינטון</button>}
    {data.nights.length===0&&!active&&<div style={{marginTop:14}}>
      <EmptyState icon="🌙" title="עוד לא היו ערבים" sub="פתחו ערב, וכל משחק שתזינו יצטרף אליו אוטומטית — בסוף מחכה סיכום"/></div>}
    {keys.map(k=><div key={k}>
      <div className="monthHead">{monthLabel(k).toUpperCase()}</div>
      <div className="stack">{groups[k].map(n=>{ const r=nightRecap(n,data.matches,data.players);
        return <button key={n.id} className="histRow" onClick={()=>go({s:'night',id:n.id})}>
          <div style={{fontSize:22}}>{n.endedAt?'🌙':'🟢'}</div>
          <div className="histNames">{n.title||'ערב בדמינטון'}
            <div className="tiny muted">{r.matches.length} משחקים{r.potn?' · 👑 '+byId(data.players,r.potn.pid).name+' — '+r.potn.wins+' ניצחונות':''}</div></div>
          <div className="histDate">{fmtDateShort(n.date)}</div>
        </button>; })}</div>
    </div>)}
    {starting&&<Sheet title="פתיחת ערב" onClose={()=>setStarting(false)}>
      <div className="stack">
        <div><div className="eyebrow" style={{marginBottom:6}}>שם הערב (לא חובה)</div>
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="שישי בדמינטון"/></div>
        <div className="tiny muted">מרגע הפתיחה, כל משחק חדש ישויך לערב הזה עד שתסיימו אותו.</div>
        <button className="btn primary" onClick={start}>זה זמן בשביל!! 🏸</button>
      </div>
    </Sheet>}
  </div>;
}

function NightRecapScreen({data,go,id}){
  const n=data.nights.find(x=>x.id===id);
  const [editTitle,setEditTitle]=useState(false);
  const [t,setT]=useState(n?.title||'');
  if(!n)return <div className="screen"><EmptyState icon="❔" title="הערב לא נמצא"/></div>;
  const r=nightRecap(n,data.matches,data.players);
  const P=pid=>byId(data.players,pid);
  const Row=({icon,label,children})=>(
    <div className="recordRow"><div className="recordIcon">{icon}</div>
      <div style={{flex:1}}><div className="eyebrow">{label}</div><div style={{marginTop:4}}>{children}</div></div></div>);
  return <div className="screen">
    <div className="headerBar"><button className="backBtn" onClick={()=>go({s:'nights'})}>→</button>

async function buildBackup(settings){
  const [players,matches,nights,settingsRows]=await Promise.all([db.players.toArray(),db.matches.toArray(),db.nights.toArray(),db.settings.toArray()]);
  return {app:APP_NAME,backupVersion:CFG.BACKUP_VERSION,schemaVersion:db.verno,exportedAt:nowISO(),
    players,matches,nights,settings:settingsRows};
}
function downloadJSON(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function Settings({data,go}){
  const {settings,matches,players,nights}=data;
  const fileRef=useRef();
  const [pending,setPending]=useState(null); // parsed backup awaiting confirm
  const [err,setErr]=useState('');
  const [toast,setToast]=useState('');
  const say=t=>{setToast(t);setTimeout(()=>setToast(''),2200);};

  const exportBackup=async()=>{
    const b=await buildBackup();
    downloadJSON(b,'zeh-zman-backup-'+dayInput(nowISO())+'.json');
    await data.setSetting('lastBackup',nowISO()); say('הגיבוי ירד למכשיר 💾');
  };
  const exportCSV=()=>{
    const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const rows=[['Date','Time','Type','Team A','Team B','Score A','Score B','Winner','Target','Night'].join(',')];
    for(const m of data.matches){
      const night=m.matchNightId? (data.nights.find(n=>n.id===m.matchNightId)?.title||'ערב'):'';
      rows.push([dayInput(m.matchDate),m.matchTime||'',m.mode,
        esc(m.teamAPlayerIds.map(id=>byId(players,id).name).join(' + ')),
        esc(m.teamBPlayerIds.map(id=>byId(players,id).name).join(' + ')),
        m.teamAScore,m.teamBScore,
        esc(winnersOf(m).map(id=>byId(players,id).name).join(' + ')),
        m.targetScore,esc(night)].join(','));
    }
    const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zeh-zman-matches.csv'; a.click();
    say('קובץ ה־CSV ירד 📄');
  };
  const pickImport=async e=>{
    setErr(''); const f=e.target.files[0]; e.target.value=''; if(!f)return;
    try{
      const b=JSON.parse(await f.text());
      if(!b||!Array.isArray(b.players)||!Array.isArray(b.matches)||!Array.isArray(b.nights))throw 0;
      for(const m of b.matches){ if(!m.id||!m.matchDate||!Array.isArray(m.teamAPlayerIds)||!Array.isArray(m.teamBPlayerIds))throw 0; }
      // גיבויים ישנים (v1) בלי matchTime/generatedByShuffle מקבלים ברירות מחדל בטוחות
      b.matches=b.matches.map(normalizeMatch);
      setPending(b);
    }catch{ setErr('הקובץ לא נראה כמו גיבוי תקין של האפליקציה. ודאו שבחרתם קובץ שיוצא מ"ייצוא גיבוי מלא".'); }
  };
  const doImport=async()=>{
    const b=pending; setPending(null);
    try{
      await db.transaction('rw',db.players,db.matches,db.nights,db.settings,async()=>{
        await Promise.all([db.players.clear(),db.matches.clear(),db.nights.clear(),db.settings.clear()]);
        await db.players.bulkAdd(b.players); await db.matches.bulkAdd(b.matches); await db.nights.bulkAdd(b.nights);
        if(b.settings)await db.settings.bulkAdd(b.settings.filter(s=>s.key!=='activeNightId'));
      });
      await data.reload(); say('הגיבוי שוחזר בהצלחה ✅');
    }catch{ setErr('השחזור נכשל — הנתונים הקיימים לא נמחקו.'); }
  };
  return <div className="screen">
    <div className="headerBar"><button className="backBtn" onClick={()=>go({s:'home'})}>→</button>
      <div className="screenTitle">הגדרות</div></div>

    <div className="card">
      <div className="eyebrow" style={{marginBottom:10}}>ברירת מחדל למשחק</div>
      <div className="tiny muted" style={{marginBottom:8}}>משחקים עד</div>
      <div className="chipRow">
        {[11,21].map(t=><button key={t} className={'chip'+(settings.defaultTarget===t?' on':'')} onClick={()=>data.setSetting('defaultTarget',t)}>{t}</button>)}
      </div>
      <div className="tiny muted" style={{margin:'12px 0 8px'}}>ניצחון בפער של</div>
      <div className="chipRow">
        {[1,2,3].map(w=><button key={w} className={'chip'+(settings.defaultWinBy===w?' on':'')} onClick={()=>data.setSetting('defaultWinBy',w)}>{w}</button>)}
      </div>
      <div className="tiny muted" style={{margin:'12px 0 8px'}}>תקרת ניקוד (ריק = בלי תקרה)</div>
      <input type="number" inputMode="numeric" placeholder="ללא תקרה" value={settings.maxScore||''}
        onChange={e=>data.setSetting('maxScore',parseInt(e.target.value)||null)}/>
    </div>

    <div className="card" style={{marginTop:12}}>
      <div className="eyebrow green" style={{marginBottom:6}}>💾 מרכז הגיבוי</div>
      <div className="tiny muted" style={{lineHeight:1.6}}>
        {matches.length} משחקים · {players.length} שחקנים · {nights.length} ערבים<br/>
        גיבוי אחרון: {settings.lastBackup? fmtDate(settings.lastBackup):'עוד לא יוצא'}
      </div>
      <div className="stack" style={{marginTop:12}}>
        <button className="btn primary" onClick={exportBackup}>ייצוא גיבוי מלא</button>
        <button className="btn ghost" onClick={()=>fileRef.current.click()}>שחזור מגיבוי…</button>
        <button className="btn ghost" onClick={exportCSV}>ייצוא היסטוריית משחקים ל־CSV</button>
      </div>
      <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={pickImport}/>
      {err&&<div className="tiny" style={{color:'var(--loss)',marginTop:10}}>{err}</div>}
      <div className="tiny muted" style={{marginTop:10}}>הנתונים משותפים לכל הקבוצה בענן (Supabase) ומתעדכנים בכל המכשירים בזמן אמת. גיבוי מלא הוא עדיין הדרך הבטוחה ביותר להתאושש ממחיקה בטעות.</div>
    </div>

    {matches.length===0&&players.length===0&&<div className="card" style={{marginTop:12}}>
      <div className="eyebrow" style={{marginBottom:6}}>נתוני דוגמה</div>
      <div className="tiny muted">רוצים לראות איך האפליקציה מרגישה אחרי חודשיים של משחקים? אפשר לטעון נתוני דוגמה ולמחוק אותם אחר כך דרך שחזור גיבוי ריק או מחיקת משחקים.</div>
      <button className="btn ghost" style={{marginTop:10,width:'100%'}} onClick={async()=>{await seedDemo();await data.reload();say('נתוני הדוגמה נטענו 🏸');}}>טעינת נתוני דוגמה</button>
    </div>}

    <div className="card" style={{marginTop:12}}>
      <div className="eyebrow" style={{marginBottom:6}}>על האפליקציה</div>
      <div className="tiny muted" style={{lineHeight:1.7}}>
        {APP_NAME} 🏸<br/>הליגה הפרטית שלכם. כל סטטיסטיקה נגזרת ישירות מהמשחקים ההיסטוריים — עריכה או מחיקה של משחק מעדכנת הכל אוטומטית.
      </div>
    </div>

    {pending&&<ConfirmDialog title="לשחזר את הגיבוי?"
      body={'הגיבוי מכיל:\n\n'+pending.players.length+' שחקנים\n'+pending.matches.length+' משחקים\n'+pending.nights.length+' ערבים\n\nנוצר: '+(pending.exportedAt?fmtDate(pending.exportedAt):'לא ידוע')+'\nגרסת גיבוי: '+(pending.backupVersion||1)+'\n\nהשחזור יחליף את כל הנתונים המשותפים של כל הקבוצה (בכל המכשירים), לא רק במכשיר הזה.'}
      confirmLabel="שחזור" danger onConfirm={doImport} onCancel={()=>setPending(null)}/>}
    <Toast msg={toast}/>
  </div>;
}

/* ================= INTRO 3D SCENE (Three.js) ================= */
function initIntroScene(container){
  const width=container.clientWidth||360, height=container.clientHeight||600;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(45,width/height,0.1,100);
  camera.position.set(0,0.5,7);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(width,height);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8fae9d,0.65));
  const key=new THREE.DirectionalLight(0xffffff,1.15); key.position.set(3,5,4); scene.add(key);
  const rim=new THREE.PointLight(0x3dbd8b,2.2,20); rim.position.set(-3,1.5,-2); scene.add(rim);
  const flash=new THREE.PointLight(0xffffff,0,14,2); scene.add(flash);

  const FORWARD=new THREE.Vector3(0,0,1);
  const IMPACT=new THREE.Vector3(0,0.02,0.15);

  const racket=new THREE.Group();
  racket.add(new THREE.Mesh(new THREE.TorusGeometry(0.62,0.05,12,40), new THREE.MeshStandardMaterial({color:0xd7ddd8,metalness:0.4,roughness:0.3})));
  const stringPts=[];
  for(let i=-4;i<=4;i++){ const x=i*0.135; stringPts.push(new THREE.Vector3(x,-0.58,0),new THREE.Vector3(x,0.58,0)); }
  for(let i=-4;i<=4;i++){ const y=i*0.135; stringPts.push(new THREE.Vector3(-0.58,y,0),new THREE.Vector3(0.58,y,0)); }
  racket.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(stringPts), new THREE.LineBasicMaterial({color:0x7c9488,transparent:true,opacity:0.55})));
  const handle=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.07,1.3,10), new THREE.MeshStandardMaterial({color:0x9a7444,roughness:0.6}));
  handle.position.y=-1.25; racket.add(handle);
  const racketStart=new THREE.Vector3(1.95,-0.3,-0.85);
  racket.position.copy(racketStart); racket.rotation.set(0.3,0.9,1.15);
  scene.add(racket);

  const shuttle=new THREE.Group();
  shuttle.add(new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16), new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.5})));
  const skirt=new THREE.Mesh(new THREE.ConeGeometry(0.28,0.5,14,1,true), new THREE.MeshStandardMaterial({color:0xf3f3ee,side:THREE.DoubleSide,roughness:0.7,transparent:true,opacity:0.92}));
  skirt.rotation.x=Math.PI/2; skirt.position.z=-0.05; shuttle.add(skirt);
  const shuttleStart=new THREE.Vector3(-2.05,0.5,-0.35);
  shuttle.position.copy(shuttleStart);
  const approachDir=IMPACT.clone().sub(shuttleStart).normalize();
  shuttle.quaternion.setFromUnitVectors(FORWARD,approachDir);
  const wobbleAxis=new THREE.Vector3(0,1,0.3).normalize();
  scene.add(shuttle);

  const smashDir=new THREE.Vector3(0.4,-0.95,-0.6).normalize();
  const smashQuat=new THREE.Quaternion().setFromUnitVectors(FORWARD,smashDir);
  const FLIGHT_SPEED=7.5;

  const trailLen=9;
  const trail=Array.from({length:trailLen}).map(()=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8), new THREE.MeshBasicMaterial({color:0xcdf3e2,transparent:true,opacity:0}));
    scene.add(m); return m;
  });
  const trailHistory=[];

  const burstMat=new THREE.MeshBasicMaterial({color:0x9be8c9,transparent:true});
  const burstGeo=new THREE.SphereGeometry(0.035,6,6);
  const burst=Array.from({length:22}).map(()=>{ const m=new THREE.Mesh(burstGeo,burstMat.clone()); m.visible=false; scene.add(m); return m; });

  let raf=null, start=null, impacted=false, disposed=false, hitStopEnd=0;
  const DUR=1.25, HITSTOP=0.09, FLIGHT=0.85, TOTAL=DUR+HITSTOP+FLIGHT+0.15;
  const camBaseZ0=7, camBaseZ1=5.3;
  const easeOutCubic=p=>1-Math.pow(1-p,3);

  function tick(ts){
    if(disposed)return;
    if(start===null)start=ts;
    const t=(ts-start)/1000;

    if(!impacted){
      const p=Math.min(t/DUR,1), e=easeOutCubic(p);
      racket.position.lerpVectors(racketStart,IMPACT,e);
      racket.rotation.y=0.9-e*2.7; racket.rotation.z=1.15-e*1.85;
      shuttle.position.lerpVectors(shuttleStart,IMPACT,e);
      const wob=new THREE.Quaternion().setFromAxisAngle(wobbleAxis,Math.sin(t*10)*0.06);
      shuttle.quaternion.setFromUnitVectors(FORWARD,approachDir).multiply(wob);
      camera.position.x=Math.sin(t*0.6)*0.08;
      camera.position.z=camBaseZ0-e*(camBaseZ0-camBaseZ1);
      camera.lookAt(IMPACT);
      if(t>=DUR){
        impacted=true; hitStopEnd=t+HITSTOP;
        flash.intensity=8.5; flash.position.copy(IMPACT);
        shuttle.position.copy(IMPACT);
        shuttle.quaternion.copy(smashQuat);
        burst.forEach((m,i)=>{
          m.visible=true; m.position.copy(IMPACT); m.material.opacity=1;
          const ang=(i/burst.length)*Math.PI*2, sp=1.3+Math.random()*1.3;
          m.userData.vel=new THREE.Vector3(Math.cos(ang)*sp,(Math.random()-0.15)*sp*1.1,Math.sin(ang)*sp*0.6-0.6);
        });
      }
    } else {
      const pt=t-DUR;
      flash.intensity=Math.max(0,8.5*(1-pt/0.3));
      const inHitStop=t<hitStopEnd;
      if(!inHitStop){
        const flightT=t-hitStopEnd;
        shuttle.position.copy(IMPACT).addScaledVector(smashDir,flightT*FLIGHT_SPEED);
        shuttle.scale.setScalar(Math.max(0.35,1-flightT*0.55));
        trailHistory.unshift(shuttle.position.clone());
        if(trailHistory.length>trailLen)trailHistory.pop();
        trail.forEach((m,i)=>{
          const pos=trailHistory[i];
          if(pos){ m.visible=true; m.position.copy(pos);
            const f=1-i/trailLen; m.material.opacity=f*0.5*Math.max(0,1-flightT*0.9); m.scale.setScalar(f); }
          else m.visible=false;
        });
        racket.rotation.y-=0.05*(1-Math.min(flightT/0.3,1)); racket.rotation.z-=0.03*(1-Math.min(flightT/0.3,1));
      }
      burst.forEach(m=>{
        if(!m.visible||inHitStop)return;
        m.position.addScaledVector(m.userData.vel,0.02);
        m.userData.vel.y-=0.03;
        m.material.opacity=Math.max(0,1-pt/0.55);
        if(m.material.opacity<=0)m.visible=false;
      });
      const kick=inHitStop?0:Math.max(0,1-(t-hitStopEnd)/0.22)*0.1;
      camera.position.x=Math.sin(t*0.6)*0.08-kick;
      camera.position.z=camBaseZ1+kick*0.6;
      camera.lookAt(IMPACT);
    }
    renderer.render(scene,camera);
    if(t<TOTAL) raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);

  const onResize=()=>{
    const w=container.clientWidth,h=container.clientHeight; if(!w||!h)return;
    camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
  };
  window.addEventListener('resize',onResize);

  return ()=>{
    disposed=true;
    if(raf)cancelAnimationFrame(raf);
    window.removeEventListener('resize',onResize);
    renderer.dispose();
    if(renderer.domElement.parentNode)renderer.domElement.parentNode.removeChild(renderer.domElement);
  };
}

/* ================= INTRO SPLASH ================= */
function Intro({players,ready,onDone}){
  const stageRef=useRef();
  const reduced=useRef(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches).current;
  const [phase,setPhase]=useState('smash'); // smash -> team -> out

  useEffect(()=>{ if(reduced) onDone(); },[]);

  useEffect(()=>{
    if(reduced||!window.THREE||!stageRef.current)return;
    return initIntroScene(stageRef.current);
  },[]);

  useEffect(()=>{
    if(reduced)return;
    if(phase==='smash'){ const t=setTimeout(()=>setPhase('team'),2350); return ()=>clearTimeout(t); }
  },[phase,reduced]);

  useEffect(()=>{
    if(reduced||phase!=='team')return;
    const t=setTimeout(()=>setPhase('out'), ready?1900:5000);
    return ()=>clearTimeout(t);
  },[phase,ready,reduced]);

  useEffect(()=>{
    if(reduced)return;
    if(phase==='out'){ const t=setTimeout(onDone,550); return ()=>clearTimeout(t); }
  },[phase,reduced]);

  if(reduced)return null;
  const team = ready? players.filter(p=>p.active).slice(0,8) : [];
  return <div className={'introOverlay'+(phase==='out'?' out':'')} data-phase={phase} onClick={onDone}>
    <div className="introInner">
      <div className="intro3d" ref={stageRef}/>
      <div className="introBrand"><h1 className="brandTitle">{APP_NAME} <Shuttle size={26}/></h1></div>
      {phase!=='smash'&&team.length>0&&<div className="introTeam">
        {team.map((p,i)=><div className="introPlayer" key={p.id} style={{animationDelay:(i*0.12)+'s'}}>
          <Avatar p={p} size={64}/>
          <div className="introPname">{p.name}</div>
        </div>)}
      </div>}
      <div className="introSkip">הקישו כדי לדלג</div>
    </div>
  </div>;
}

/* ================= APP SHELL ================= */
function App(){
  const data=useData();
  const [route,setRoute]=useState({s:'home'});
  const [intro,setIntro]=useState(true);
  const go=r=>{ setRoute(r); window.scrollTo(0,0); };
  if(intro) return <Intro players={data.players} ready={data.ready} onDone={()=>setIntro(false)}/>;
  if(!data.ready)return <div className="app" style={{alignItems:'center',justifyContent:'center'}}>
    <div style={{textAlign:'center'}}><Shuttle size={44}/><div className="muted tiny" style={{marginTop:10}}>טוען את המגרש…</div></div></div>;
  const s=route.s;
  const tab = ['home'].includes(s)?'home' : ['new','past','edit','shuffle'].includes(s)?'new'
    : ['players','player'].includes(s)?'players' : ['stats','hof','h2h'].includes(s)?'stats'
    : ['history','match'].includes(s)?'history' : ['nights','night'].includes(s)?'nights' : '';
  return <div className="app">
    {s==='home'&&<Home data={data} go={go}/>}
    {s==='new'&&<MatchWizard key={route.prefill?'pre':'new'} data={data} go={go} prefill={route.prefill}/>}
    {s==='shuffle'&&<Shuffle data={data} go={go}/>}
    {s==='past'&&<MatchWizard data={data} go={go} past/>}
    {s==='edit'&&<MatchWizard data={data} go={go} editMatch={data.matches.find(m=>m.id===route.id)}/>}
    {s==='players'&&<Players data={data} go={go}/>}
    {s==='player'&&<PlayerProfile data={data} go={go} id={route.id}/>}
    {s==='h2h'&&<H2H data={data} go={go} a={route.a} b={route.b}/>}
    {s==='stats'&&<Stats data={data} go={go}/>}
    {s==='hof'&&<HallOfFame data={data} go={go} initialScope={route.scope}/>}
    {s==='history'&&<History data={data} go={go}/>}
    {s==='match'&&<MatchDetail data={data} go={go} id={route.id}/>}
    {s==='nights'&&<Nights data={data} go={go}/>}
    {s==='night'&&<NightRecapScreen data={data} go={go} id={route.id}/>}
    {s==='settings'&&<Settings data={data} go={go}/>}
    <nav className="nav"><div className="bar">
      <button className={tab==='home'?'on':''} onClick={()=>go({s:'home'})}>{Icon.home}בית</button>
      <button className={tab==='history'?'on':''} onClick={()=>go({s:'history'})}>{Icon.hist}היסטוריה</button>
      <button className={tab==='new'?'on':''} onClick={()=>go({s:'new'})}>{Icon.plus}משחק</button>
      <button className={tab==='nights'?'on':''} onClick={()=>go({s:'nights'})}>{Icon.moon}ערבים</button>
      <button className={tab==='players'?'on':''} onClick={()=>go({s:'players'})}>{Icon.users}שחקנים</button>
      <button className={tab==='stats'?'on':''} onClick={()=>go({s:'stats'})}>{Icon.stats}מספרים</button>
    </div></nav>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
