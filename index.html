<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>זה זמן בשביל!!</title>
<meta name="theme-color" content="#0d1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="זה זמן בשביל!!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:ital,wght@0,500;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1411; --surface:#141d18; --surface2:#1a2620; --line:#26362d; --line2:#31453a;
  --text:#eef3ef; --text2:#9db3a7; --text3:#68806f;
  --court:#3dbd8b; --court-dim:#2a8f68; --court-deep:#173a2b;
  --accent:#3dbd8b; --accent-soft:rgba(61,189,139,.14);
  --gold:#e5b45a; --loss:#e07a6a; --win:#3dbd8b;
  --r:18px; --r-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
  font-family:'Heebo',system-ui,-apple-system,sans-serif;min-height:100%;}
body{overscroll-behavior-y:none}
#root{min-height:100vh;display:flex;flex-direction:column}
.app{width:100%;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
@media(min-width:900px){.app{max-width:640px}}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--surface2);
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--court)}
::placeholder{color:var(--text3)}
h1,h2,h3{margin:0}
.screen{flex:1;padding:18px 18px calc(96px + var(--safe-b));animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- brand ---------- */
.brandTitle{font-weight:900;font-size:30px;letter-spacing:-.5px;line-height:1.05;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brandTitle .shuttle{transform:rotate(-20deg)}
.brandSub{color:var(--text2);font-size:13px;margin-top:6px;letter-spacing:.06em}
.courtHero{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(160deg,#152019,#101a14)}
.courtHero svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.courtHero .inner{position:relative;padding:22px 20px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
.nav .bar{pointer-events:auto;display:flex;gap:2px;background:rgba(18,26,21,.92);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:22px;margin:0 12px calc(12px + var(--safe-b));padding:6px;
  width:100%;max-width:520px;box-shadow:var(--shadow)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;
  color:var(--text3);font-size:10.5px;font-weight:700;transition:color .15s, background .15s}
.nav button.on{color:var(--court);background:var(--accent-soft)}
.nav svg{width:22px;height:22px}

/* ---------- cards / general ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card,.stack>*+*{margin-top:12px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--text3)}
.eyebrow.green{color:var(--court)}
.rowBetween{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;
  border-radius:16px;padding:15px 18px;transition:transform .1s, filter .15s;user-select:none}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--court);color:#08120d}
.btn.ghost{background:var(--surface2);border:1px solid var(--line2);color:var(--text)}
.btn.danger{background:rgba(224,122,106,.12);border:1px solid rgba(224,122,106,.4);color:var(--loss)}
.btn.small{padding:9px 14px;font-size:13.5px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chipRow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);
  font-weight:700;font-size:13.5px;color:var(--text2)}
.chip.on{background:var(--accent-soft);border-color:var(--court);color:var(--court)}
.statBig{font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.statLbl{font-size:11.5px;color:var(--text2);font-weight:600;margin-top:2px}
.divider{height:1px;background:var(--line);margin:14px 0}
.muted{color:var(--text2)}.tiny{font-size:12px}
.sectionTitle{font-size:17px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.linkAll{color:var(--court);font-weight:700;font-size:13px}

/* ---------- avatars / names ---------- */
.avatar{border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--court);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.pname{font-weight:800;line-height:1.15}
.nick{font-family:'Rubik',sans-serif;font-style:italic;font-weight:500;color:var(--text2);font-size:.82em;letter-spacing:.01em}
.nick::before{content:"״"}.nick::after{content:"״"}
.formDots{display:flex;gap:4px;font-size:11px;font-weight:900;direction:ltr}
.formDots span{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.formDots .w{background:var(--accent-soft);color:var(--win);border:1px solid rgba(61,189,139,.35)}
.formDots .l{background:rgba(224,122,106,.1);color:var(--loss);border:1px solid rgba(224,122,106,.3)}

/* ---------- match card ---------- */
.matchCard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.matchScoreRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.teamCol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.teamCol .names{font-weight:800;font-size:14px;text-align:center;line-height:1.25}
.bigScore{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.bigScore.winS{color:var(--win)}.bigScore.loseS{color:var(--text3)}
.vsMini{font-size:11px;font-weight:900;color:var(--text3);letter-spacing:.1em}
.matchMeta{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;color:var(--text2);background:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px}
.tag.green{color:var(--court);background:var(--accent-soft);border-color:rgba(61,189,139,.3)}

/* ---------- court ---------- */
.courtWrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,#14231b,#101b15)}
.courtSvg{display:block;width:100%;height:auto}
.slotBtn{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:96px}
.slotPlus{width:62px;height:62px;border-radius:50%;border:2px dashed var(--court-dim);color:var(--court);
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:400;
  background:rgba(13,20,17,.55);backdrop-filter:blur(3px);transition:transform .12s}
.slotBtn:active .slotPlus{transform:scale(.94)}
.slotName{font-size:12px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.7);max-width:100px;text-align:center;line-height:1.15}
.slotNick{font-size:10px}
.slotAvatar{box-shadow:0 4px 14px rgba(0,0,0,.5);border-color:var(--court)!important;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- sheets & dialogs ---------- */
.sheetBack{position:fixed;inset:0;background:rgba(5,9,7,.66);z-index:60;display:flex;align-items:flex-end;justify-content:center;
  animation:fadein .15s ease}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;
  width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;animation:up .22s ease;
  padding-bottom:var(--safe-b)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheetHead{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sheetBody{overflow-y:auto;padding:14px 18px 24px}
.dialogBack{position:fixed;inset:0;background:rgba(5,9,7,.7);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadein .15s ease}
.dialog{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}

/* ---------- pick list ---------- */
.pickRow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;text-align:start;transition:background .12s}
.pickRow:active{background:var(--surface2)}
.pickRow .info{flex:1;min-width:0}
.pickRow.disabled{opacity:.35;pointer-events:none}

/* ---------- score entry ---------- */
.scorePad{display:flex;align-items:center;justify-content:center;gap:14px}
.scoreBtn{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);
  font-size:24px;font-weight:800;color:var(--text);display:flex;align-items:center;justify-content:center}
.scoreBtn:active{background:var(--line)}
.scoreVal{width:86px;text-align:center;font-size:52px;font-weight:900;background:none;border:none;
  color:var(--text);font-variant-numeric:tabular-nums;padding:0}
.scoreVal:focus{outline:none;color:var(--court)}

/* ---------- history ---------- */
.monthHead{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--text3);margin:20px 0 8px}
.histRow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:background .12s}
.histRow:active{background:var(--surface2)}
.histScore{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.histNames{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.3}
.histDate{font-size:11px;color:var(--text3);white-space:nowrap}

/* ---------- H2H ---------- */
.h2hBar{height:10px;border-radius:999px;background:rgba(224,122,106,.35);overflow:hidden;display:flex}
.h2hBar i{display:block;background:var(--court);height:100%;border-radius:0 999px 999px 0}
.recordRow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.recordRow:last-child{border-bottom:none}
.recordIcon{font-size:22px;width:34px;text-align:center}
.badge{background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.badge.locked{opacity:.38;filter:grayscale(.6)}
.badge .ic{font-size:22px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:calc(100px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:90;
  background:var(--surface2);border:1px solid var(--court);color:var(--text);font-weight:700;font-size:14px;
  padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);animation:up .2s ease;white-space:nowrap}
.confirmSave{ text-align:center }
.trophyRow{display:flex;align-items:baseline;gap:10px}
.hofVal{font-weight:900;color:var(--court);font-variant-numeric:tabular-nums}
/* scope tabs (הכל / יחידות / זוגות) */
.segTabs{display:flex;background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.segTabs button{flex:1;padding:9px 6px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--text2);transition:background .15s,color .15s}
.segTabs button.on{background:var(--surface);color:var(--court);box-shadow:0 2px 8px rgba(0,0,0,.35)}
/* shuffle */
.plChip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);width:100%;text-align:start;transition:border-color .12s,background .12s}
.plChip.on{border-color:var(--court);background:var(--accent-soft)}
.plChip .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#08120d;flex:none}
.plChip.on .chk{background:var(--court);border-color:var(--court)}
.rollWrap{display:flex;justify-content:center;gap:14px;margin:26px 0 12px}
.rollAv{animation:roll .16s linear infinite alternate}
@keyframes roll{from{transform:translateY(-6px) scale(.92);opacity:.55}to{transform:translateY(6px) scale(1.05);opacity:1}}
.rollText{letter-spacing:.3em;font-weight:900;color:var(--court);animation:blink .5s ease infinite alternate}
@keyframes blink{from{opacity:.35}to{opacity:1}}
.reveal{animation:reveal .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes reveal{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.vsBig{font-size:34px;font-weight:900;letter-spacing:.2em;color:var(--text3);margin:10px 0;animation:fadein .6s ease .25s both}
.insight{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:none}
.insight .v{font-weight:900;font-size:16px}
.searchBox{position:relative;margin-bottom:12px}
.netDivider{height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 8px,transparent 8px 14px);margin:14px 0;position:relative}
.headerBar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.backBtn{width:38px;height:38px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.screenTitle{font-size:21px;font-weight:900;flex:1}

/* ---------- intro splash ---------- */
.introOverlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 15%,#182a20,#0a100c 72%);cursor:pointer;
  transition:opacity .55s ease;}
.introOverlay.out{opacity:0;pointer-events:none}
.introInner{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden}
.intro3d{position:absolute;inset:0;transition:opacity .6s ease}
.intro3d canvas{display:block;width:100%!important;height:100%!important}
.introOverlay[data-phase="team"] .intro3d,.introOverlay[data-phase="out"] .intro3d{opacity:0}
.introBrand{position:relative;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px);
  transition:opacity .5s ease,transform .5s ease}
.introOverlay[data-phase="team"] .introBrand,.introOverlay[data-phase="out"] .introBrand{opacity:1;transform:none}
.introBrand .brandTitle{font-size:26px}
.introTeam{position:relative;display:flex;gap:14px;margin-top:28px;flex-wrap:wrap;justify-content:center;max-width:520px;padding:0 24px}
.introPlayer{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;
  animation:introPop .45s cubic-bezier(.2,.9,.3,1.3) forwards}
.introPname{font-size:11px;font-weight:800;color:var(--text2);max-width:72px;text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
@keyframes introPop{0%{opacity:0;transform:translateY(24px) scale(.6)}100%{opacity:1;transform:none}}
.introSkip{position:absolute;bottom:30px;font-size:11.5px;font-weight:700;color:var(--text3);opacity:0;
  transition:opacity .4s ease .2s}
.introOverlay[data-phase="team"] .introSkip,.introOverlay[data-phase="out"] .introSkip{opacity:1}
@media(prefers-reduced-motion:reduce){.introOverlay{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel" data-presets="env,react">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

/* ================= DATABASE (Supabase — משותף לכל הקבוצה) ================= */
const SUPABASE_URL = 'https://frmtbysuqftrynadwldt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XiwqwIr9TT22688rplSXaA_rVtl5au8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* עוטף טבלת Supabase בממשק פשוט (toArray/add/put/update/delete/bulkAdd/clear) */
function sbTable(name, idField='id'){
  const unwrap=({data,error})=>{ if(error) throw error; return data; };
  return {
    toArray: async()=> (await unwrap(await sb.from(name).select('*'))) || [],
    add: async(obj)=>{ unwrap(await sb.from(name).insert(obj)); return obj[idField]; },
    bulkAdd: async(arr)=>{ if(!arr||!arr.length) return; unwrap(await sb.from(name).insert(arr)); },
    put: async(obj)=> unwrap(await sb.from(name).upsert(obj,{onConflict:idField})),
    update: async(key,changes)=> unwrap(await sb.from(name).update(changes).eq(idField,key)),
    delete: async(key)=> unwrap(await sb.from(name).delete().eq(idField,key)),
    clear: async()=> unwrap(await sb.from(name).delete().not(idField,'is',null)),
  };
}
const db = {
  verno: 2, // v2: matchTime + generatedByShuffle (ר' normalizeMatch)
  players: sbTable('players'),
  matches: sbTable('matches'),
  nights: sbTable('nights'),
  settings: sbTable('settings','key'),
  transaction: async(mode, ...args)=> args[args.length-1](), // Supabase אין תמיכת JS-side; שימוש רציף מספיק כאן
};
/* ברירות מחדל בטוחות לרשומות ישנות/מגיבויים ישנים */
function normalizeMatch(m){
  return {...m,
    matchTime: (typeof m.matchTime==='string' && /^\d{2}:\d{2}$/.test(m.matchTime))? m.matchTime : null,
    generatedByShuffle: m.generatedByShuffle===true,
    seq: m.seq||0};
}
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const nowISO = ()=> new Date().toISOString();

/* ================= CONFIG THRESHOLDS ================= */
const CFG = {
  MIN_H2H_FOR_NEMESIS: 5,      // מפגשים מינימליים לנמסיס/יריב אהוב
  MIN_DUO_MATCHES: 3,          // מינימום משחקי צמד לליגת הצמדים
  MIN_MATCHES_WINRATE: 5,      // מינימום משחקים לטבלת אחוזי ניצחון
  MIN_PERFECT_NIGHT: 3,        // מינימום משחקים לערב מושלם
  MARATHON_OVER_TARGET: 4,     // כמה מעל היעד נחשב "מרתון" (11 -> 15+)
  BACKUP_REMINDER_DAYS: 30,
  BACKUP_VERSION: 2,          // v2: matchTime + generatedByShuffle
  SHUFFLE_ATTEMPTS: 30         // כמה ניסיונות להימנע מריצת חוזרת מיידית לפני שמוותרים
};
const APP_NAME = 'זה זמן בשביל!!';

/* ================= HELPERS ================= */
const fmtDate = iso => { const d=new Date(iso); return d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}); };
const fmtDateShort = iso => new Date(iso).toLocaleDateString('he-IL',{day:'numeric',month:'short'});
const monthKey = iso => { const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const monthLabel = key => { const [y,m]=key.split('-'); return new Date(y,m-1,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'}); };
const pct = (w,t)=> t? Math.round(w/t*1000)/10 : 0;
const fmtTime = t => t||'';                                   // matchTime נשמר כ-"HH:MM"
const fmtDateTimeShort = m => fmtDateShort(m.matchDate)+(m.matchTime?' · '+m.matchTime:'');
const nowTime = ()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const dayInput = iso => { const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* חוק הניקוד: יעד + פער winBy. מעבר ליעד — חייבים לסגור בדיוק בפער winBy (דיוס), אלא אם יש תקרה. */
function validateScore(a,b,target,winBy,maxScore){
  a=+a; b=+b; target=+target; winBy=+winBy||2;
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0) return {ok:false,msg:'נקודות חייבות להיות מספרים שלמים וחיוביים'};
  const hi=Math.max(a,b), lo=Math.min(a,b);
  if(a===b) return {ok:false,msg:'אין תיקו בבדמינטון — מישהו חייב לנצח'};
  if(maxScore && hi===maxScore && hi>lo) return {ok:true};
  if(maxScore && hi>maxScore) return {ok:false,msg:'התוצאה עוברת את תקרת הניקוד ('+maxScore+')'};
  if(hi<target) return {ok:false,msg:'המנצח חייב להגיע לפחות ל־'+target+' נקודות'};
  if(hi===target){
    if(hi-lo<winBy) return {ok:false,msg:'המנצח חייב להוביל בלפחות '+winBy+' נקודות'};
    return {ok:true};
  }
  if(hi-lo!==winBy) return {ok:false,msg:'אחרי '+(target-1)+'–'+(target-1)+' המשחק נסגר בדיוק בפער של '+winBy+' (למשל '+(lo+winBy)+'–'+lo+')'};
  return {ok:true};
}

/* מיון כרונולוגי דטרמיניסטי: תאריך משחק -> סדר בערב -> נוצר */
/* תאריך משחק -> שעת משחק (רק כששתיהן ידועות) -> סדר בערב -> נוצר. createdAt לעולם לא מחליף שעת משחק. */
function sortMatches(ms){
  return [...ms].sort((x,y)=>{
    const d = new Date(x.matchDate)-new Date(y.matchDate); if(d) return d;
    if(x.matchTime&&y.matchTime&&x.matchTime!==y.matchTime) return x.matchTime<y.matchTime?-1:1;
    const s = (x.seq||0)-(y.seq||0); if(s) return s;
    return new Date(x.createdAt)-new Date(y.createdAt);
  });
}
/* ---- SCOPES: overall / singles / doubles ---- */
const SCOPES=[{id:'overall',label:'הכל'},{id:'singles',label:'יחידות'},{id:'doubles',label:'זוגות'}];
const filterMatchesByMode=(ms,scope)=> (!scope||scope==='overall')? ms : ms.filter(m=>m.mode===scope);
const getPlayerStats=(pid,ms,scope)=> playerStats(pid,filterMatchesByMode(ms,scope));
const winnersOf = m => m.winner==='teamA'? m.teamAPlayerIds : m.teamBPlayerIds;
const losersOf  = m => m.winner==='teamA'? m.teamBPlayerIds : m.teamAPlayerIds;
const inMatch = (m,pid)=> m.teamAPlayerIds.includes(pid)||m.teamBPlayerIds.includes(pid);
const sideOf = (m,pid)=> m.teamAPlayerIds.includes(pid)?'teamA':(m.teamBPlayerIds.includes(pid)?'teamB':null);
const wonBy = (m,pid)=> winnersOf(m).includes(pid);
const scoreFor = (m,pid)=> sideOf(m,pid)==='teamA'? m.teamAScore : m.teamBScore;
const scoreAgainst = (m,pid)=> sideOf(m,pid)==='teamA'? m.teamBScore : m.teamAScore;

/* ================= STATS ENGINE (הכל נגזר מההיסטוריה) ================= */
function playerStats(pid, matches, mode){
  let ms = matches.filter(m=>inMatch(m,pid));
  if(mode) ms = ms.filter(m=>m.mode===mode);
  ms = sortMatches(ms);
  let wins=0,losses=0,pf=0,pa=0;
  const results=[];
  for(const m of ms){
    const w=wonBy(m,pid); if(w)wins++; else losses++;
    pf+=scoreFor(m,pid); pa+=scoreAgainst(m,pid);
    results.push(w?'W':'L');
  }
  let cur=0; for(let i=results.length-1;i>=0;i--){ if(results[i]==='W')cur++; else break; }
  let best=0,run=0; for(const r of results){ run = r==='W'? run+1:0; if(run>best)best=run; }
  return {played:ms.length,wins,losses,winRate:pct(wins,ms.length),pf,pa,diff:pf-pa,
    curStreak:cur,bestStreak:best,last5:results.slice(-5),last10:results.slice(-10),matches:ms};
}
function headToHead(a,b,matches){
  const ms = sortMatches(matches.filter(m=>m.mode==='singles' && inMatch(m,a)&&inMatch(m,b)));
  let aW=0,bW=0,aP=0,bP=0;
  const seqA=[];
  for(const m of ms){
    if(wonBy(m,a)){aW++; seqA.push('W');} else {bW++; seqA.push('L');}
    aP+=scoreFor(m,a); bP+=scoreFor(m,b);
  }
  const streak=(who)=>{let best=0,run=0;for(const r of seqA){const w = who==='a'? r==='W':r==='L'; run=w?run+1:0; if(run>best)best=run;}return best;};
  return {matches:ms,total:ms.length,aWins:aW,bWins:bW,aPts:aP,bPts:bP,
    aBestStreak:streak('a'),bBestStreak:streak('b'),last5:seqA.slice(-5),latest:ms[ms.length-1]||null};
}
function duoKey(p1,p2){ return [p1,p2].sort().join('|'); }
function allDuos(matches){
  const map={};
  for(const m of matches.filter(m=>m.mode==='doubles')){
    for(const side of ['teamAPlayerIds','teamBPlayerIds']){
      const ids=m[side]; if(ids.length!==2)continue;
      const k=duoKey(ids[0],ids[1]);
      map[k]=map[k]||{ids:[...ids].sort(),played:0,wins:0,losses:0,pf:0,pa:0};
      const d=map[k]; d.played++;
      const won = (m.winner==='teamA')===(side==='teamAPlayerIds');
      if(won)d.wins++; else d.losses++;
      const my = side==='teamAPlayerIds'? m.teamAScore : m.teamBScore;
      const op = side==='teamAPlayerIds'? m.teamBScore : m.teamAScore;
      d.pf+=my; d.pa+=op;
    }
  }
  return Object.values(map).map(d=>({...d,winRate:pct(d.wins,d.played)}));
}
function opponentRecords(pid,matches){ // singles vs each opponent
  const map={};
  for(const m of matches.filter(m=>m.mode==='singles'&&inMatch(m,pid))){
    const opp = (m.teamAPlayerIds.includes(pid)? m.teamBPlayerIds:m.teamAPlayerIds)[0];
    map[opp]=map[opp]||{opp,played:0,wins:0,losses:0};
    map[opp].played++; if(wonBy(m,pid))map[opp].wins++; else map[opp].losses++;
  }
  return Object.values(map);
}
function biggestVictory(matches){
  let best=null;
  for(const m of matches){
    const margin=Math.abs(m.teamAScore-m.teamBScore);
    if(!best||margin>best.margin) best={m,margin};
  }
  return best;
}
function closestRivalry(players,matches){
  let best=null;
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const h=headToHead(players[i].id,players[j].id,matches);
    if(h.total<CFG.MIN_H2H_FOR_NEMESIS) continue;
    const gap=Math.abs(h.aWins-h.bWins);
    if(!best || gap<best.gap || (gap===best.gap&&h.total>best.h.total)) best={a:players[i],b:players[j],h,gap};
  }
  return best;
}
function mostPlayedRivalry(players,matches){
  let best=null;
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const h=headToHead(players[i].id,players[j].id,matches);
    if(h.total===0)continue;
    if(!best||h.total>best.h.total) best={a:players[i],b:players[j],h};
  }
  return best;
}
function nightRecap(night,matches,players){
  const ms=sortMatches(matches.filter(m=>m.matchNightId===night.id));
  const pids=[...new Set(ms.flatMap(m=>[...m.teamAPlayerIds,...m.teamBPlayerIds]))];
  const perPlayer=pids.map(pid=>{
    let w=0,l=0,pf=0,pa=0; const seq=[];
    for(const m of ms){ if(!inMatch(m,pid))continue;
      const won=wonBy(m,pid); won?w++:l++; seq.push(won?'W':'L');
      pf+=scoreFor(m,pid); pa+=scoreAgainst(m,pid); }
    let best=0,run=0;for(const r of seq){run=r==='W'?run+1:0;if(run>best)best=run;}
    return {pid,wins:w,losses:l,pf,pa,diff:pf-pa,streak:best,played:w+l};
  });
  const potn=[...perPlayer].sort((a,b)=> b.wins-a.wins || pct(b.wins,b.played)-pct(a.wins,a.played) || b.diff-a.diff)[0]||null;
  const streakLeader=[...perPlayer].sort((a,b)=>b.streak-a.streak)[0]||null;
  const topScorer=[...perPlayer].sort((a,b)=>b.pf-a.pf)[0]||null;
  let closest=null,biggest=null;
  for(const m of ms){ const mg=Math.abs(m.teamAScore-m.teamBScore), tot=m.teamAScore+m.teamBScore;
    if(!closest||mg<closest.mg||(mg===closest.mg&&tot>closest.tot))closest={m,mg,tot};
    if(!biggest||mg>biggest.mg)biggest={m,mg};
  }
  const duos={};
  for(const m of ms.filter(m=>m.mode==='doubles')){
    for(const side of['teamAPlayerIds','teamBPlayerIds']){
      const k=duoKey(...m[side]); duos[k]=duos[k]||{ids:[...m[side]].sort(),w:0,l:0};
      ((m.winner==='teamA')===(side==='teamAPlayerIds'))?duos[k].w++:duos[k].l++;
    }
  }
  const bestDuo=Object.values(duos).sort((a,b)=> b.w-a.w || a.l-b.l)[0]||null;
  return {matches:ms,players:pids,perPlayer,potn,streakLeader,topScorer,closest,biggest,bestDuo};
}


/* ================= SHUFFLE MATCH (אקראי אמיתי, בלי דירוגים) ================= */
const sameSet=(a,b)=> a.length===b.length && [...a].sort().join('|')===[...b].sort().join('|');
/* אותו מפגש? יחידות: אותם 2 שחקנים. זוגות: אותם שני צמדים (בלי קשר לצד A/B). */
function sameMatchup(x,y){
  if(!x||!y||x.mode!==y.mode) return false;
  if(x.mode==='singles') return sameSet([...x.teamAPlayerIds,...x.teamBPlayerIds],[...y.teamAPlayerIds,...y.teamBPlayerIds]);
  const kx=[duoKey(...x.teamAPlayerIds),duoKey(...x.teamBPlayerIds)].sort().join('#');
  const ky=[duoKey(...y.teamAPlayerIds),duoKey(...y.teamBPlayerIds)].sort().join('#');
  return kx===ky;
}
function pickRandom(pool,n,rng=Math.random){
  const arr=[...pool]; const out=[];
  while(out.length<n&&arr.length){ const i=Math.floor(rng()*arr.length); out.push(arr.splice(i,1)[0]); }
  return out;
}
/* בוחר סוג משחק בפועל עבור "הכל" לפי גודל המאגר. מחזיר null אם אין מספיק שחקנים. */
function resolveShuffleMode(type,poolSize,rng=Math.random){
  if(type==='singles') return poolSize>=2? 'singles':null;
  if(type==='doubles') return poolSize>=4? 'doubles':null;
  if(poolSize<2) return null;
  if(poolSize<4) return 'singles';
  return rng()<0.5? 'singles':'doubles';
}
function drawMatchup(mode,pool,rng=Math.random){
  if(mode==='singles'){ const [a,b]=pickRandom(pool,2,rng); return {mode,teamAPlayerIds:[a],teamBPlayerIds:[b]}; }
  const [a,b,c,d]=pickRandom(pool,4,rng); return {mode,teamAPlayerIds:[a,b],teamBPlayerIds:[c,d]};
}
/* "להימנע כשאפשר, לא לאסור": מנסה כמה פעמים לא לחזור על המפגש הקודם; אם אין אלטרנטיבה — מחזיר בכל זאת. */
function avoidImmediateRematch(mode,pool,avoid,rng=Math.random){
  let cand=null;
  for(let i=0;i<CFG.SHUFFLE_ATTEMPTS;i++){
    cand=drawMatchup(mode,pool,rng);
    if(!avoid.some(m=>sameMatchup(m,cand))) return {...cand,repeated:false};
  }
  return {...cand,repeated:true};
}
/* type: 'any' | 'singles' | 'doubles'. pool: מזהי שחקנים שנבחרו (פעילים בלבד). avoid: משחקים/הצעות להימנע מהם. */
function generateShuffleMatch({type,pool,avoid=[],rng=Math.random}){
  const uniq=[...new Set(pool)];
  const mode=resolveShuffleMode(type,uniq.length,rng);
  if(!mode) return {error: type==='doubles'?'זוגות דורש לפחות 4 שחקנים זמינים.':'צריך לפחות 2 שחקנים כדי לערבב.'};
  return avoidImmediateRematch(mode,uniq,avoid.filter(m=>m&&m.mode===mode),rng);
}
/* המשחק האחרון מאותו סוג — זה מה שמנסים לא לחזור עליו */
const lastMatchOfMode=(matches,mode)=>{ for(let i=matches.length-1;i>=0;i--) if(matches[i].mode===mode) return matches[i]; return null; };

/* ================= MATCHUP INSIGHTS (רק מנתונים אמיתיים) ================= */
/* מחזיר עד 3 עובדות: [{k,label,value,sub}] — מדורגות לפי עניין, בלי כפילויות (k ייחודי). */
function getSinglesMatchupInsights(a,b,matches,players,rng=Math.random){
  const A=byId(players,a),B=byId(players,b);
  const h=headToHead(a,b,matches);
  if(h.total===0) return {first:true,items:[]};
  const c=[];
  c.push({k:'meetings',pr:100,label:'מפגשים קודמים',value:h.total===1?'מפגש אחד':h.total+' מפגשים'});
  if(h.aWins!==h.bWins){ const lead=h.aWins>h.bWins? A:B; c.push({k:'h2h',pr:95,label:'מאזן ראש בראש',value:lead.name+' מוביל '+Math.max(h.aWins,h.bWins)+'–'+Math.min(h.aWins,h.bWins)}); }
  else c.push({k:'h2h',pr:95,label:'מאזן ראש בראש',value:'תיקו '+h.aWins+'–'+h.bWins});
  c.push({k:'pts',pr:70,label:'נקודות ביריבות',value:A.name+' '+h.aPts+' · '+B.name+' '+h.bPts});
  const L=h.latest; if(L){ const w=byId(players,winnersOf(L)[0]); c.push({k:'last',pr:80,label:'המפגש האחרון',value:w.name+' ניצח '+Math.max(L.teamAScore,L.teamBScore)+'–'+Math.min(L.teamAScore,L.teamBScore),sub:fmtDateShort(L.matchDate)}); }
  // רצף נוכחי ביריבות
  let run=0,who=null; for(let i=h.matches.length-1;i>=0;i--){ const w=wonBy(h.matches[i],a)?a:b; if(who===null)who=w; if(w===who)run++; else break; }
  if(run>=2) c.push({k:'streak',pr:85,label:'רצף נוכחי ביריבות',value:byId(players,who).name+' — '+run+' ניצחונות ברצף'});
  const bestS=Math.max(h.aBestStreak,h.bBestStreak); if(bestS>=3&&bestS!==run) c.push({k:'beststreak',pr:60,label:'הרצף הארוך ביריבות',value:(h.aBestStreak>=h.bBestStreak?A:B).name+' — '+bestS+' ברצף'});
  if(h.total>=2){
    let cl=null,bg=null; for(const m of h.matches){ const mg=Math.abs(m.teamAScore-m.teamBScore); if(!cl||mg<cl.mg)cl={m,mg}; if(!bg||mg>bg.mg)bg={m,mg}; }
    if(cl) c.push({k:'closest',pr:65,label:'המשחק הצמוד ביניהם',value:Math.max(cl.m.teamAScore,cl.m.teamBScore)+'–'+Math.min(cl.m.teamAScore,cl.m.teamBScore),sub:fmtDateShort(cl.m.matchDate)});
    if(bg&&bg.mg>=5) c.push({k:'biggest',pr:55,label:'הניצחון הגדול ביריבות',value:byId(players,winnersOf(bg.m)[0]).name+' '+Math.max(bg.m.teamAScore,bg.m.teamBScore)+'–'+Math.min(bg.m.teamAScore,bg.m.teamBScore)});
    const dpts=h.aPts-h.bPts; if(dpts!==0) c.push({k:'ptsdiff',pr:40,label:'הפרש נקודות מצטבר',value:(dpts>0?A:B).name+' +'+Math.abs(dpts)});
  }
  return {first:false,items:pickInsights(c,rng)};
}
function getDoublesMatchupInsights(tA,tB,matches,players,rng=Math.random){
  const duos=allDuos(matches);
  const dA=duos.find(d=>d.ids.join('|')===duoKey(...tA))||null;
  const dB=duos.find(d=>d.ids.join('|')===duoKey(...tB))||null;
  const nm=ids=>ids.map(id=>byId(players,id).name).join(' + ');
  const exact=sortMatches(matches.filter(m=>m.mode==='doubles'&&sameMatchup(m,{mode:'doubles',teamAPlayerIds:tA,teamBPlayerIds:tB})));
  const c=[];
  const duoLine=(d,ids,k,pr)=>{ if(!d) return; c.push({k,pr,label:nm(ids),value:d.played+(d.played===1?' משחק יחד':' משחקים יחד')+' · '+Math.round(d.winRate)+'%',sub:d.wins+'–'+d.losses}); };
  duoLine(dA,tA,'duoA',100); duoLine(dB,tB,'duoB',98);
  if(exact.length){
    let aw=0,bw=0,ap=0,bp=0; for(const m of exact){ const aSide=sameSet(m.teamAPlayerIds,tA); const aWon=(m.winner==='teamA')===aSide; aWon?aw++:bw++; ap+=aSide?m.teamAScore:m.teamBScore; bp+=aSide?m.teamBScore:m.teamAScore; }
    c.push({k:'exact',pr:96,label:'מפגש בין הצמדים האלה',value: exact.length===1?'פעם אחת עד היום':exact.length+' פעמים · '+(aw===bw?'תיקו '+aw+'–'+bw:(aw>bw?nm(tA):nm(tB))+' מוביל '+Math.max(aw,bw)+'–'+Math.min(aw,bw))});
    const L=exact[exact.length-1]; const wIds=winnersOf(L);
    c.push({k:'lastexact',pr:80,label:'המפגש האחרון ביניהם',value:nm(wIds)+' ניצחו '+Math.max(L.teamAScore,L.teamBScore)+'–'+Math.min(L.teamAScore,L.teamBScore),sub:fmtDateShort(L.matchDate)});
    if(exact.length>=2) c.push({k:'exactpts',pr:50,label:'נקודות במפגשים האלה',value:nm(tA)+' '+ap+' · '+nm(tB)+' '+bp});
  } else if(dA||dB){ c.push({k:'exact',pr:90,label:'מפגש בין הצמדים האלה',value:'פעם ראשונה שהצמדים האלה נפגשים'}); }
  // רצף שותפות נוכחי
  const partnerStreak=(ids)=>{ const ms=sortMatches(matches.filter(m=>m.mode==='doubles'&&(sameSet(m.teamAPlayerIds,ids)||sameSet(m.teamBPlayerIds,ids)))); let run=0; for(let i=ms.length-1;i>=0;i--){ const won=(ms[i].winner==='teamA')===sameSet(ms[i].teamAPlayerIds,ids); if(won)run++; else break; } return run; };
  const sA=partnerStreak(tA), sB=partnerStreak(tB);
  if(sA>=2) c.push({k:'streakA',pr:75,label:'רצף שותפות',value:nm(tA)+' — '+sA+' ניצחונות ברצף יחד'});
  if(sB>=2&&sB>=sA) c.push({k:'streakB',pr:74,label:'רצף שותפות',value:nm(tB)+' — '+sB+' ניצחונות ברצף יחד'});
  if(dA&&dB&&dA.winRate!==dB.winRate&&dA.played>=2&&dB.played>=2) c.push({k:'better',pr:60,label:'הצמד עם אחוז הניצחון הגבוה',value:(dA.winRate>dB.winRate?nm(tA):nm(tB))+' · '+Math.round(Math.max(dA.winRate,dB.winRate))+'%'});
  return {first:c.length===0,items:pickInsights(c,rng)};
}
/* עובדות "ליבה" (pr>=90) תמיד מוצגות; את המקומות שנותרו ממלאים אקראית מהשאר — כדי שהמסך לא יחזור על עצמו */
function pickInsights(c,rng=Math.random){
  const seen=new Set(); const uniq=c.filter(x=>{ if(seen.has(x.k))return false; seen.add(x.k); return true; }).sort((a,b)=>b.pr-a.pr);
  if(uniq.length<=3) return uniq;
  const core=uniq.filter(x=>x.pr>=90).slice(0,3); const rest=uniq.filter(x=>!core.includes(x));
  const out=[...core];
  while(out.length<3&&rest.length) out.push(rest.splice(Math.floor(rng()*rest.length),1)[0]);
  return out.sort((a,b)=>b.pr-a.pr);
}
function getMatchupInsights(matchup,matches,players,rng=Math.random){
  return matchup.mode==='singles'
    ? getSinglesMatchupInsights(matchup.teamAPlayerIds[0],matchup.teamBPlayerIds[0],matches,players,rng)
    : getDoublesMatchupInsights(matchup.teamAPlayerIds,matchup.teamBPlayerIds,matches,players,rng);
}
/* משתתפי ערב פעיל = מי ששיחק בו; אם עוד לא שיחקו — כל הפעילים */
function shuffleDefaultPool(players,matches,settings){
  const act=players.filter(p=>p.active).map(p=>p.id);
  if(settings.activeNightId){
    const ids=new Set(matches.filter(m=>m.matchNightId===settings.activeNightId).flatMap(m=>[...m.teamAPlayerIds,...m.teamBPlayerIds]));
    const pool=act.filter(id=>ids.has(id));
    if(pool.length>=2) return pool;
  }
  return act;
}

/* ================= ACHIEVEMENTS ================= */
const ACH_DEFS=[
  {id:'on_fire',icon:'🔥',name:'על אש',desc:'5 ניצחונות ברצף'},
  {id:'king_court',icon:'👑',name:'מלך המגרש',desc:'5 ניצחונות בערב אחד'},
  {id:'no_mercy',icon:'💀',name:'בלי רחמים',desc:'ניצחון עד 11 עם 2 נקודות ספיגה לכל היותר'},
  {id:'dynamic_duo',icon:'🤝',name:'צמד חמד',desc:'10 ניצחונות עם אותו פרטנר'},
  {id:'nemesis',icon:'⚔️',name:'נמסיס',desc:'10 ניצחונות מול אותו יריב'},
  {id:'veteran',icon:'🏅',name:'ותיק',desc:'100 משחקים'},
  {id:'century',icon:'💯',name:'מועדון האלף',desc:'1,000 נקודות קריירה'},
  {id:'marathon',icon:'🕰️',name:'משחק מרתון',desc:'משחק שנמשך הרבה מעבר ליעד (למשל 18–16 עד 11)'},
  {id:'perfect_night',icon:'✨',name:'ערב מושלם',desc:'ניצחון בכל משחקי הערב (לפחות '+CFG.MIN_PERFECT_NIGHT+')'},
];
function playerAchievements(pid,matches,nights){
  const ms=sortMatches(matches.filter(m=>inMatch(m,pid)));
  const earned={};
  const mark=(id,m)=>{ if(!earned[id]) earned[id]={date: m? m.matchDate : nowISO()}; };
  let run=0,pf=0,partnerWins={},oppWins={};
  ms.forEach((m,i)=>{
    const won=wonBy(m,pid);
    run=won?run+1:0; if(run>=5)mark('on_fire',m);
    pf+=scoreFor(m,pid); if(pf>=1000)mark('century',m);
    if(i+1>=100)mark('veteran',m);
    if(won&&m.mode==='singles'&&m.targetScore===11&&scoreAgainst(m,pid)<=2)mark('no_mercy',m);
    if(Math.max(m.teamAScore,m.teamBScore)>=m.targetScore+CFG.MARATHON_OVER_TARGET)mark('marathon',m);
    if(won&&m.mode==='doubles'){
      const partner=sideOf(m,pid)==='teamA'? m.teamAPlayerIds.find(x=>x!==pid):m.teamBPlayerIds.find(x=>x!==pid);
      partnerWins[partner]=(partnerWins[partner]||0)+1;
      if(partnerWins[partner]>=10)mark('dynamic_duo',m);
    }
    if(won&&m.mode==='singles'){
      const opp=losersOf(m)[0]; oppWins[opp]=(oppWins[opp]||0)+1;
      if(oppWins[opp]>=10)mark('nemesis',m);
    }
  });
  for(const n of nights){
    const nm=ms.filter(m=>m.matchNightId===n.id);
    if(!nm.length)continue;
    const w=nm.filter(m=>wonBy(m,pid)).length;
    if(w>=5)mark('king_court',nm[nm.length-1]);
    if(w===nm.length&&nm.length>=CFG.MIN_PERFECT_NIGHT)mark('perfect_night',nm[nm.length-1]);
  }
  return ACH_DEFS.map(d=>({...d,earned:!!earned[d.id],date:earned[d.id]?.date}));
}

/* ================= IMAGE RESIZE ================= */
function processImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const S=320, c=document.createElement('canvas');
        const side=Math.min(img.width,img.height);
        c.width=S;c.height=S;
        c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
        res(c.toDataURL('image/jpeg',.82)); };
      img.onerror=()=>rej(new Error('bad image')); img.src=r.result; };
    r.onerror=()=>rej(new Error('read fail')); r.readAsDataURL(file);
  });
}

/* ================= DATA HOOK ================= */
function useData(){
  const [players,setPlayers]=useState([]);
  const [matches,setMatches]=useState([]);
  const [nights,setNights]=useState([]);
  const [settings,setSettings]=useState({defaultTarget:11,defaultWinBy:2,maxScore:null,activeNightId:null,lastBackup:null});
  const [ready,setReady]=useState(false);
  const reload=useCallback(async()=>{
    const [p,m,n,s]=await Promise.all([db.players.toArray(),db.matches.toArray(),db.nights.toArray(),db.settings.toArray()]);
    setPlayers(p); setMatches(sortMatches(m.map(normalizeMatch))); setNights(n.sort((a,b)=>new Date(b.date)-new Date(a.date)));
    const st={defaultTarget:11,defaultWinBy:2,maxScore:null,activeNightId:null,lastBackup:null};
    s.forEach(x=>st[x.key]=x.value); setSettings(st); setReady(true);
  },[]);
  useEffect(()=>{
    reload();
    /* עדכון חי בכל המכשירים כשמישהו בקבוצה שומר/מוחק נתונים */
    const channel = sb.channel('zzb-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'players'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'matches'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'nights'},reload)
      .on('postgres_changes',{event:'*',schema:'public',table:'settings'},reload)
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[]);
  const setSetting=async(key,value)=>{ await db.settings.put({key,value}); reload(); };
  return {players,matches,nights,settings,ready,reload,setSetting};
}

      <div className="tiny muted">💾 {settings.lastBackup? 'הגיבוי האחרון היה לפני יותר מ־'+CFG.BACKUP_REMINDER_DAYS+' יום':'עוד לא יצא גיבוי — שווה לייצא אחד'}</div>
      <span className="linkAll">למרכז הגיבוי</span>
    </button>}
  </div>;
}

/* ================= MATCH WIZARD (חדש / עריכה / משחק עבר) ================= */
function MatchWizard({data,go,editMatch,past,prefill}){
  const {settings,players}=data;
  // prefill מגיע מ-SHUFFLE MATCH: שחקנים + סוג כבר נבחרו, ממשיכים ישר להגדרות ניקוד
  const [step,setStep]=useState(editMatch?'score':(prefill?'config':'mode'));
  const [mode,setMode]=useState(editMatch?.mode||prefill?.mode||'singles');
  const [slots,setSlots]=useState(editMatch
    ? {A:[...editMatch.teamAPlayerIds],B:[...editMatch.teamBPlayerIds]}
    : prefill? {A:[...prefill.teamAPlayerIds,null,null].slice(0,2),B:[...prefill.teamBPlayerIds,null,null].slice(0,2)}
    : {A:[null,null],B:[null,null]});
  const [fromShuffle]=useState(!!prefill?.generatedByShuffle);
  const [target,setTarget]=useState(editMatch?.targetScore??settings.defaultTarget??11);
  const [customT,setCustomT]=useState('');
  const [winBy,setWinBy]=useState(editMatch?.winBy??settings.defaultWinBy??2);
  const [scoreA,setScoreA]=useState(editMatch?.teamAScore??0);
  const [scoreB,setScoreB]=useState(editMatch?.teamBScore??0);
  const [date,setDate]=useState(editMatch? dayInput(editMatch.matchDate) : dayInput(nowISO()));
  // שעת המשחק: במשחק עבר אופציונלית (ריק = לא ידוע), בעריכה ניתנת לשינוי, במשחק חי נקבעת בשמירה
  const [time,setTime]=useState(editMatch? (editMatch.matchTime||'') : '');
  const [nightId,setNightId]=useState(editMatch? (editMatch.matchNightId||''): (past?'':(settings.activeNightId||'')));
  const [picker,setPicker]=useState(null);
  const [err,setErr]=useState('');
  const [saved,setSaved]=useState(null);

  const need = mode==='singles'?1:2;
  const chosen=[...slots.A.slice(0,need),...slots.B.slice(0,need)].filter(Boolean);
  const complete=chosen.length===need*2 && new Set(chosen).size===need*2;
  const effTarget = target==='custom'? parseInt(customT)||0 : target;

  const onSlot=(team,i)=>setPicker({team,i});
  const doPick=p=>{ setSlots(s=>{ const n={A:[...s.A],B:[...s.B]}; n[picker.team][picker.i]=p.id; return n;}); setPicker(null); };
  const clearSlot=(team,i)=>setSlots(s=>{const n={A:[...s.A],B:[...s.B]}; n[team][i]=null; return n;});

  const save=async()=>{
    const v=validateScore(scoreA,scoreB,effTarget,winBy,settings.maxScore);
    if(!v.ok){setErr(v.msg);return;}
    if(!complete){setErr('חסרים שחקנים במגרש');return;}
    if(!date){setErr('חסר תאריך למשחק');return;}
    const rec={
      id:editMatch?.id||uid(),
      matchNightId:nightId||null,
      matchDate:new Date(date+'T12:00:00').toISOString(),
      matchTime: (editMatch||past)? (time||null) : nowTime(),
      generatedByShuffle: editMatch? !!editMatch.generatedByShuffle : fromShuffle,
      mode, targetScore:effTarget, winBy, maxScore:settings.maxScore||null,
      teamAPlayerIds:slots.A.slice(0,need), teamBPlayerIds:slots.B.slice(0,need),
      teamAScore:+scoreA, teamBScore:+scoreB,
      winner:+scoreA>+scoreB?'teamA':'teamB',
      playerIds:[...slots.A.slice(0,need),...slots.B.slice(0,need)],
      seq: editMatch?.seq ?? (nightId? (data.matches.filter(m=>m.matchNightId===nightId).length+1):0),
      createdAt:editMatch?.createdAt||nowISO(), updatedAt:nowISO()
    };
    await db.matches.put(rec);
    await db.settings.put({key:'defaultTarget',value:effTarget});
    await db.settings.put({key:'defaultWinBy',value:winBy});
    await data.reload();
    if(editMatch){ go({s:'match',id:rec.id}); return; }
    setSaved(rec);
  };

  if(saved){
    const A=saved.teamAPlayerIds.map(id=>byId(players,id)), B=saved.teamBPlayerIds.map(id=>byId(players,id));
    const wA=saved.winner==='teamA';
    return <div className="screen" style={{display:'flex',flexDirection:'column',justifyContent:'center'}}>
      <div className="card confirmSave" style={{padding:'34px 20px'}}>
        <div className="eyebrow green">עוד אחד לספרי ההיסטוריה</div>
        <div style={{fontSize:20,fontWeight:900,margin:'10px 0 20px'}}>המשחק נשמר 🏸</div>
        <div className="matchScoreRow">
          <div className="teamCol">
            <div style={{display:'flex'}}>{A.map((p,i)=><Avatar key={p.id} p={p} size={56} style={i>0?{marginInlineStart:-12}:null}/>)}</div>
            <div className="names">{A.map(p=>p.name).join(' + ')}</div>
            <div className={'bigScore '+(wA?'winS':'loseS')}>{saved.teamAScore}</div>
          </div>
          <div className="vsMini">—</div>
          <div className="teamCol">
            <div style={{display:'flex'}}>{B.map((p,i)=><Avatar key={p.id} p={p} size={56} style={i>0?{marginInlineStart:-12}:null}/>)}</div>
            <div className="names">{B.map(p=>p.name).join(' + ')}</div>
            <div className={'bigScore '+(!wA?'winS':'loseS')}>{saved.teamBScore}</div>
          </div>
        </div>
        <div className="stack" style={{marginTop:26}}>
          <button className="btn primary" onClick={()=>{setSaved(null);setScoreA(0);setScoreB(0);setStep('court');setSlots({A:[null,null],B:[null,null]});setErr('');}}>משחק נוסף</button>
          <button className="btn ghost" onClick={()=>go({s:'home'})}>חזרה הביתה</button>
        </div>
      </div>
    </div>;
  }

  const title = editMatch? 'עריכת משחק' : past? 'הוספת משחק עבר' : 'משחק חדש';
  return <div className="screen">
    <div className="headerBar">
      <button className="backBtn" onClick={()=>editMatch?go({s:'match',id:editMatch.id}):go({s:prefill?'shuffle':'home'})}>→</button>
      <div className="screenTitle">{title}{fromShuffle&&<span className="tag green" style={{marginInlineStart:8,verticalAlign:'middle'}}>🎲 שאפל</span>}</div>
    </div>

    {step==='mode'&&<div className="stack">
      <div className="eyebrow">סוג משחק</div>
      <button className={'card rowBetween'} style={{width:'100%'}} onClick={()=>{setMode('singles');setStep('court');}}>
        <div><div style={{fontWeight:900,fontSize:19}}>1 על 1</div><div className="tiny muted">יחידות — יריבות אישית</div></div>
        <div style={{fontSize:26}}>🤺</div>
      </button>
      <button className={'card rowBetween'} style={{width:'100%'}} onClick={()=>{setMode('doubles');setStep('court');}}>
        <div><div style={{fontWeight:900,fontSize:19}}>2 על 2</div><div className="tiny muted">זוגות — כימיה של צמדים</div></div>
        <div style={{fontSize:26}}>🤝</div>
      </button>
      {!past&&<>
        <div className="eyebrow" style={{marginTop:10}}>או</div>
        <button className="courtHero" style={{width:'100%',textAlign:'start'}} onClick={()=>go({s:'shuffle'})}>
          <CourtLines/>
          <div className="inner rowBetween">
            <div><div className="eyebrow green">SHUFFLE MATCH</div>
              <div style={{fontWeight:900,fontSize:19,marginTop:4}}>תנו לגורל לבחור 🎲</div>
              <div className="tiny muted" style={{marginTop:2}}>הגרלה אקראית · יחידות, זוגות או מה שיוצא</div></div>
            <Shuttle size={34}/>
          </div>
        </button>
      </>}
    </div>}

    {step==='court'&&<>
      <div className="eyebrow" style={{marginBottom:10}}>מי על המגרש? לחצו על ה־+ במיקום</div>
      <Court mode={mode} slots={slots} players={players} onSlot={(t,i)=> slots[t][i]? clearSlot(t,i):onSlot(t,i)}/>
      <div className="rowBetween" style={{marginTop:14}}>
        <button className="btn ghost small" onClick={()=>setStep('mode')}>{mode==='singles'?'מעבר ל־2 על 2':'מעבר ל־1 על 1'}</button>
        <button className="btn primary" disabled={!complete} onClick={()=>setStep('config')}>המשך ←</button>
      </div>
    </>}

    {step==='config'&&<div className="stack">
      <div className="card">
        <div className="eyebrow" style={{marginBottom:10}}>משחקים עד</div>
        <div className="chipRow">
          {[11,21].map(t=><button key={t} className={'chip'+(target===t?' on':'')} onClick={()=>setTarget(t)}>{t}</button>)}
          <button className={'chip'+(target==='custom'?' on':'')} onClick={()=>setTarget('custom')}>אחר</button>
        </div>
        {target==='custom'&&<input type="number" inputMode="numeric" style={{marginTop:10}} placeholder="יעד נקודות" value={customT} onChange={e=>setCustomT(e.target.value)}/>}
        <div className="divider"/>
        <div className="eyebrow" style={{marginBottom:10}}>ניצחון בפער של</div>
        <div className="chipRow">{[1,2,3].map(w=><button key={w} className={'chip'+(winBy===w?' on':'')} onClick={()=>setWinBy(w)}>{w}</button>)}</div>
      </div>
      {(past||editMatch)&&<div className="card">
        <div className="grid2">
          <div><div className="eyebrow" style={{marginBottom:8}}>תאריך המשחק</div>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div><div className="eyebrow" style={{marginBottom:8}}>שעה <span style={{fontWeight:600}}>(לא חובה)</span></div>
            <input type="time" value={time} onChange={e=>setTime(e.target.value)}/></div>
        </div>
        {data.nights.length>0&&<>
          <div className="eyebrow" style={{margin:'12px 0 8px'}}>שיוך לערב (לא חובה)</div>
          <select value={nightId} onChange={e=>setNightId(e.target.value)}>
            <option value="">ללא ערב</option>
            {data.nights.map(n=><option key={n.id} value={n.id}>{(n.title||'ערב')+' · '+fmtDateShort(n.date)}</option>)}
          </select>
        </>}
      </div>}
      <button className="btn primary" disabled={target==='custom'&&!(parseInt(customT)>0)} onClick={()=>setStep('ready')}>המשך ←</button>
    </div>}

    {step==='ready'&&(()=>{ const A=slots.A.slice(0,need).map(id=>byId(players,id)), B=slots.B.slice(0,need).map(id=>byId(players,id));
      return <div className="stack">
      <div className="courtHero"><CourtLines/><div className="inner" style={{textAlign:'center'}}>
        <div className="eyebrow green">המגרש מוכן</div>
        <div style={{display:'flex',justifyContent:'center',gap:6,margin:'16px 0 6px'}}>
          {A.map((p,i)=><Avatar key={p.id} p={p} size={64} style={i>0?{marginInlineStart:-14}:null}/>)}
        </div>
        {A.map(p=><div key={p.id}><span className="pname" style={{fontSize:17}}>{p.name}</span> {p.nickname&&<span className="nick">{p.nickname}</span>}</div>)}
        <div style={{fontWeight:900,color:'var(--text3)',letterSpacing:'.2em',margin:'12px 0'}}>VS</div>
        <div style={{display:'flex',justifyContent:'center',gap:6,marginBottom:6}}>
          {B.map((p,i)=><Avatar key={p.id} p={p} size={64} style={i>0?{marginInlineStart:-14}:null}/>)}
        </div>
        {B.map(p=><div key={p.id}><span className="pname" style={{fontSize:17}}>{p.name}</span> {p.nickname&&<span className="nick">{p.nickname}</span>}</div>)}
        <div className="tag green" style={{display:'inline-block',marginTop:14}}>עד {effTarget} · פער {winBy}</div>
      </div></div>
      <button className="btn primary" onClick={()=>setStep('score')}>הזנת תוצאה ←</button>
    </div>; })()}

    {step==='score'&&(()=>{ const A=slots.A.slice(0,need).map(id=>byId(players,id)), B=slots.B.slice(0,need).map(id=>byId(players,id));
      const Pad=({val,setVal,team})=>(
        <div style={{textAlign:'center'}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:6}}>
            {team.map((p,i)=><Avatar key={p.id} p={p} size={46} style={i>0?{marginInlineStart:-10}:null}/>)}
          </div>
          <div style={{fontWeight:800,fontSize:14,marginBottom:8}}>{team.map(p=>p.name).join(' + ')}</div>
          <div className="scorePad">
            <button className="scoreBtn" onClick={()=>setVal(v=>Math.max(0,+v-1))}>−</button>
            <input className="scoreVal" type="number" inputMode="numeric" value={val}
              onFocus={e=>e.target.select()} onChange={e=>setVal(e.target.value===''?'':Math.max(0,parseInt(e.target.value)||0))}/>
            <button className="scoreBtn" onClick={()=>setVal(v=>+v+1)}>+</button>
          </div>
        </div>);
      return <div className="stack">
        {editMatch&&<>
          <div className="eyebrow">שחקנים — לחיצה על מיקום מחליפה שחקן</div>
          <Court mode={mode} slots={slots} players={players} onSlot={(t,i)=>onSlot(t,i)}/>
          <div className="card">
            <div className="grid2">
              <div><div className="eyebrow" style={{marginBottom:6}}>תאריך</div><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
              <div><div className="eyebrow" style={{marginBottom:6}}>שעה (לא חובה)</div><input type="time" value={time} onChange={e=>setTime(e.target.value)}/></div>
            </div>
            <div className="grid2" style={{marginTop:10}}>
              <div><div className="eyebrow" style={{marginBottom:6}}>עד</div><input type="number" value={effTarget} onChange={e=>{setTarget('custom');setCustomT(e.target.value);}}/></div>
            </div>
            <div style={{marginTop:10}}><div className="eyebrow" style={{marginBottom:6}}>סוג</div>
              <div className="chipRow">
                <button className={'chip'+(mode==='singles'?' on':'')} onClick={()=>setMode('singles')}>1 על 1</button>
                <button className={'chip'+(mode==='doubles'?' on':'')} onClick={()=>setMode('doubles')}>2 על 2</button>
              </div></div>
            {data.nights.length>0&&<div style={{marginTop:10}}><div className="eyebrow" style={{marginBottom:6}}>ערב</div>
              <select value={nightId} onChange={e=>setNightId(e.target.value)}>
                <option value="">ללא ערב</option>
                {data.nights.map(n=><option key={n.id} value={n.id}>{(n.title||'ערב')+' · '+fmtDateShort(n.date)}</option>)}
              </select></div>}
          </div>
        </>}
        <div className="card" style={{padding:'22px 14px'}}>
          <div className="eyebrow green" style={{textAlign:'center',marginBottom:16}}>התוצאה הסופית</div>
          <Pad val={scoreA} setVal={setScoreA} team={A}/>
          <div className="netDivider"/>
          <Pad val={scoreB} setVal={setScoreB} team={B}/>
        </div>
        {err&&<div className="card" style={{borderColor:'rgba(224,122,106,.5)',color:'var(--loss)',fontWeight:700,fontSize:14}}>{err}</div>}
        <button className="btn primary" onClick={save}>{editMatch?'שמירת שינויים':'שמירת המשחק'}</button>
      </div>; })()}

    {picker&&<PlayerPicker data={data} exclude={chosen} onPick={doPick} onClose={()=>setPicker(null)}/>}
  </div>;
}


/* ================= SHUFFLE MATCH SCREEN ================= */
function Shuffle({data,go}){
  const {players,matches,settings}=data;
  const active=players.filter(p=>p.active);
  const [type,setType]=useState('any');
  const [pool,setPool]=useState(()=>shuffleDefaultPool(players,matches,settings));
  const [phase,setPhase]=useState('setup'); // setup | rolling | found
  const [result,setResult]=useState(null);
  const [insights,setInsights]=useState(null);
  const [err,setErr]=useState('');
  const [tick,setTick]=useState(0);
  const timer=useRef();
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  useEffect(()=>{ if(phase!=='rolling')return; const iv=setInterval(()=>setTick(t=>t+1),110); return ()=>clearInterval(iv); },[phase]);

  const toggle=id=>setPool(p=> p.includes(id)? p.filter(x=>x!==id):[...p,id]);
  const minNeeded= type==='doubles'?4:2;

  const roll=()=>{
    setErr('');
    const avoid=[lastMatchOfMode(matches,'singles'),lastMatchOfMode(matches,'doubles'),result].filter(Boolean);
    const r=generateShuffleMatch({type,pool,avoid});
    if(r.error){ setErr(r.error); return; }
    setPhase('rolling'); setResult(null);
    timer.current=setTimeout(()=>{ setResult(r); setInsights(getMatchupInsights(r,matches,players)); setPhase('found'); },900);
  };
  const play=()=>go({s:'new',prefill:{mode:result.mode,teamAPlayerIds:result.teamAPlayerIds,teamBPlayerIds:result.teamBPlayerIds,generatedByShuffle:true}});

  const Team=({ids,label})=>{ const ps=ids.map(id=>byId(players,id));
    return <div style={{textAlign:'center'}}>
      {label&&<div className="eyebrow" style={{marginBottom:8}}>{label}</div>}
      <div style={{display:'flex',justifyContent:'center',gap:6}}>
        {ps.map((p,i)=><Avatar key={p.id} p={p} size={ps.length>1?70:92} style={i>0?{marginInlineStart:-16}:null}/>)}
      </div>
      {ps.map(p=><div key={p.id} style={{marginTop:6}}><div className="pname" style={{fontSize:ps.length>1?16:20}}>{p.name}</div>{p.nickname&&<div className="nick">{p.nickname}</div>}</div>)}
    </div>; };

  return <div className="screen">
    <div className="headerBar">
      <button className="backBtn" onClick={()=>phase==='found'?setPhase('setup'):go({s:'new'})}>→</button>
      <div className="screenTitle">SHUFFLE MATCH 🎲</div>
    </div>

    {phase==='setup'&&<div className="stack">
      {active.length<2&&<EmptyState icon="🎲" title="צריך לפחות 2 שחקנים פעילים" action="לשחקנים" onAction={()=>go({s:'players'})}/>}
      {active.length>=2&&<>
        <div className="card">
          <div className="eyebrow" style={{marginBottom:10}}>סוג ההגרלה</div>
          <div className="segTabs">
            {[['any','הכל'],['singles','1 על 1'],['doubles','2 על 2']].map(([id,l])=>
              <button key={id} className={type===id?'on':''} onClick={()=>{setType(id);setErr('');}}>{l}</button>)}
          </div>
          <div className="tiny muted" style={{marginTop:8}}>
            {type==='any'? (pool.length>=4?'עם 4 שחקנים ומעלה — ההגרלה יכולה לבחור יחידות או זוגות':'עם פחות מ־4 שחקנים ההגרלה תהיה יחידות בלבד')
             : type==='singles'?'שני שחקנים אקראיים':'ארבעה שחקנים אקראיים, מחולקים לשני צמדים'}
          </div>
        </div>
        <div className="card">
          <div className="rowBetween" style={{marginBottom:10}}>
            <div className="eyebrow">מי משתתף ({pool.length})</div>
            <div style={{display:'flex',gap:6}}>
              <button className="chip" style={{padding:'5px 10px',fontSize:12}} onClick={()=>setPool(active.map(p=>p.id))}>כולם</button>
              <button className="chip" style={{padding:'5px 10px',fontSize:12}} onClick={()=>setPool([])}>נקה</button>
            </div>
          </div>
          {settings.activeNightId&&<div className="tiny" style={{color:'var(--court)',marginBottom:8}}>🟢 ערב פעיל — הרשימה התחילה ממי שכבר שיחק הערב</div>}
          <div className="stack" style={{gap:8,display:'grid',gridTemplateColumns:'1fr 1fr'}}>

        </div>

        {pool.length<minNeeded&&!err&&<div className="tiny muted" style={{textAlign:'center'}}>{type==='doubles'?'בחרו לפחות 4 שחקנים לזוגות':'בחרו לפחות 2 שחקנים'}</div>}

    {phase==='rolling'&&(()=>{ const ps=pool.map(id=>byId(players,id)); const n=Math.min(4,ps.length);
      const show=Array.from({length:n},(_,i)=>ps[(tick*7+i*3)%ps.length]);

    {phase==='found'&&result&&<div className="stack">

        <div style={{marginTop:18}}><Team ids={result.teamAPlayerIds} label={result.mode==='doubles'?'TEAM A':null}/></div>
        <div className="vsBig">VS</div>
        <Team ids={result.teamBPlayerIds} label={result.mode==='doubles'?'TEAM B':null}/>
      </div></div>

      <div className="card reveal" style={{animationDelay:'.15s'}}>
        {insights.first
          ? <div style={{textAlign:'center',padding:'6px 0'}}>
              <div className="eyebrow green">FIRST MEETING</div>
              <div style={{fontWeight:900,fontSize:17,marginTop:8}}>{result.mode==='singles'?'מפגש ראשון':'פעם ראשונה של הצמדים האלה'}</div>
              <div className="tiny muted" style={{marginTop:4}}>יריבות חדשה נולדת הלילה</div>
            </div>
          : <>
              <div className="eyebrow" style={{marginBottom:4}}>מהספרים</div>
              {insights.items.map(it=><div key={it.k} className="insight">
                <div className="tiny muted">{it.label}</div>

      </div>

      <button className="btn primary" style={{fontSize:18}} onClick={play}>PLAY THIS MATCH 🏸</button>
      <button className="btn ghost" onClick={roll}>SHUFFLE AGAIN 🎲</button>
    </div>}
  </div>;
}

/* ================= MINI CHARTS ================= */
function MonthlyBars({pid,matches}){
  const byM={};
  for(const m of matches.filter(m=>inMatch(m,pid))){
    const k=monthKey(m.matchDate); byM[k]=byM[k]||{w:0,l:0};
    wonBy(m,pid)?byM[k].w++:byM[k].l++;
  }
  const keys=Object.keys(byM).sort().slice(-6);
  if(keys.length<2)return null;
  const max=Math.max(...keys.map(k=>byM[k].w+byM[k].l));
  return <div className="card">
    <div className="eyebrow" style={{marginBottom:12}}>ניצחונות / הפסדים לפי חודש</div>
    <div style={{display:'flex',gap:10,alignItems:'flex-end',height:110}}>
      {keys.map(k=>{ const d=byM[k];
        return <div key={k} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,height:'100%',justifyContent:'flex-end'}}>
          <div style={{width:'70%',display:'flex',flexDirection:'column',justifyContent:'flex-end',gap:2,height:'100%'}}>
            <div style={{background:'var(--win)',borderRadius:4,height:(d.w/max*100)+'%',minHeight:d.w?4:0}}/>
            <div style={{background:'rgba(224,122,106,.6)',borderRadius:4,height:(d.l/max*100)+'%',minHeight:d.l?4:0}}/>
          </div>
          <div className="tiny muted" style={{fontSize:10}}>{k.slice(5)}/{k.slice(2,4)}</div>
        </div>; })}
    </div>
    <div className="tiny muted" style={{marginTop:8,display:'flex',gap:12}}>
      <span><span style={{color:'var(--win)'}}>■</span> ניצחונות</span>
      <span><span style={{color:'var(--loss)'}}>■</span> הפסדים</span>
    </div>
  </div>;
}
function WinRateOverTime({pid,matches}){
  const ms=sortMatches(matches.filter(m=>inMatch(m,pid)));
  if(ms.length<5)return null;
  let w=0; const pts=ms.map((m,i)=>{ if(wonBy(m,pid))w++; return w/(i+1)*100; });
  const W=300,H=90;
  const path=pts.map((p,i)=>(i?'L':'M')+(i/(pts.length-1)*W).toFixed(1)+' '+(H-p/100*H).toFixed(1)).join(' ');
  return <div className="card">
    <div className="eyebrow" style={{marginBottom:10}}>אחוז ניצחון לאורך זמן</div>
    <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:'auto',direction:'ltr'}}>
      <line x1="0" y1={H/2} x2={W} y2={H/2} stroke="var(--line2)" strokeDasharray="4 4"/>
      <path d={path} fill="none" stroke="var(--court)" strokeWidth="2.5" strokeLinejoin="round"/>
    </svg>
    <div className="tiny muted" style={{marginTop:6}}>כרגע: {pts[pts.length-1].toFixed(1)}% · הקו המקווקו הוא 50%</div>
  </div>;
}
